<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Framoid Reflection 25: Two neighbours go to war over militants sheltering across the border</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* Layout: one screen. A toolbar of floating islands on top (back, sections, utilities; tools/toolbar.js)
   over a stage that shows the Subject, one pair or Framoid's reflection at a time.
   The Subject view carries its own orbit: each pair faces the other across Framoid.
   Colour fields behind the glass shift to the gods in view. On phones the sections move to a
   floating tab bar at the bottom and each pair becomes a swipeable row of cards. */
@property --b1 { syntax: "<color>"; inherits: true; initial-value: #b8461f; }
@property --b2 { syntax: "<color>"; inherits: true; initial-value: #1f6e86; }
@property --b3 { syntax: "<color>"; inherits: true; initial-value: #5b4a9e; }

:root {
  --bg: #eceef4;
  --ink: #14151a;
  --muted: #5c606e;
  --glass: rgba(255, 255, 255, 0.5);
  --glass-strong: rgba(255, 255, 255, 0.78);
  --seg: rgba(20, 24, 40, 0.06);
  --stroke: rgba(255, 255, 255, 0.7);
  --hairline: rgba(20, 24, 40, 0.08);
  --hl: rgba(255, 255, 255, 0.95);
  --spec: rgba(255, 255, 255, 0.55);
  --shadow: rgba(30, 36, 70, 0.14);
  --blob: 0.5;
  --focus: #0a6cff;

  --rodim: #c4461a;
  --aromi: #13789a;
  --mir:   #95661d;
  --ora:   #5e47b8;
  --idrom: #4b5b6d;
  --doria: #2f8443;
  /* Text shades: god colours as small text (badges, tags, labels) at 4.5:1 or better on glass.
     Orbs, large names and fills keep the god colour itself. */
  --rodim-text: #a73b16; --aromi-text: #106784; --mir-text: #805819; --doria-text: #276e38;
  --ora-text: var(--ora); --idrom-text: var(--idrom);

  --text: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: var(--text);
  --rounded: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08090d; --ink: #f3f3f6; --muted: #9ea2b0;
    --glass: rgba(30, 32, 42, 0.46); --glass-strong: rgba(58, 61, 74, 0.7); --seg: rgba(255, 255, 255, 0.07);
    --stroke: rgba(255, 255, 255, 0.13); --hairline: rgba(255, 255, 255, 0.08);
    --hl: rgba(255, 255, 255, 0.2); --spec: rgba(255, 255, 255, 0.1); --shadow: rgba(0, 0, 0, 0.5);
    --blob: 0.42; --focus: #5aa2ff;
    --rodim: #ff7a45; --aromi: #4cc3e6; --mir: #e0ae5c; --ora: #a996ff; --idrom: #a6b6c8; --doria: #6fd284;
    --rodim-text: var(--rodim); --aromi-text: var(--aromi); --mir-text: var(--mir); --doria-text: var(--doria);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08090d; --ink: #f3f3f6; --muted: #9ea2b0;
  --glass: rgba(30, 32, 42, 0.46); --glass-strong: rgba(58, 61, 74, 0.7); --seg: rgba(255, 255, 255, 0.07);
  --stroke: rgba(255, 255, 255, 0.13); --hairline: rgba(255, 255, 255, 0.08);
  --hl: rgba(255, 255, 255, 0.2); --spec: rgba(255, 255, 255, 0.1); --shadow: rgba(0, 0, 0, 0.5);
  --blob: 0.42; --focus: #5aa2ff;
  --rodim: #ff7a45; --aromi: #4cc3e6; --mir: #e0ae5c; --ora: #a996ff; --idrom: #a6b6c8; --doria: #6fd284;
  --rodim-text: var(--rodim); --aromi-text: var(--aromi); --mir-text: var(--mir); --doria-text: var(--doria);
  color-scheme: dark;
}

html, body { height: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--text); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  transition: --b1 1.1s ease, --b2 1.1s ease, --b3 1.1s ease;
}
body[data-view="subject"]   { --b1: var(--aromi); --b2: var(--doria); --b3: var(--rodim); }
body[data-view="decision"]  { --b1: var(--rodim); --b2: var(--aromi); --b3: var(--ora); }
body[data-view="matter"]    { --b1: var(--mir);   --b2: var(--ora);   --b3: var(--aromi); }
body[data-view="structure"] { --b1: var(--idrom); --b2: var(--doria); --b3: var(--mir); }
body[data-view="field"]     { --b1: var(--mir);   --b2: var(--doria); --b3: var(--rodim); }

/* Colour fields behind the glass */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: var(--blob); }
.blob.a { width: 52vmax; height: 52vmax; top: -18vmax; left: -12vmax; background: var(--b1); animation: drift-a 28s ease-in-out infinite alternate; }
.blob.b { width: 50vmax; height: 50vmax; bottom: -22vmax; right: -14vmax; background: var(--b2); animation: drift-b 32s ease-in-out infinite alternate; }
.blob.c { width: 30vmax; height: 30vmax; top: 34%; left: 44%; background: var(--b3); opacity: calc(var(--blob) * 0.6); animation: drift-c 24s ease-in-out infinite alternate; }
@keyframes drift-a { to { transform: translate(8vmax, 6vmax) scale(1.08); } }
@keyframes drift-b { to { transform: translate(-7vmax, -5vmax) scale(0.94); } }
@keyframes drift-c { to { transform: translate(-10vmax, 4vmax) scale(1.15); } }

/* Glass material */
.glass {
  position: relative;
  background: var(--glass);
  -webkit-backdrop-filter: blur(28px) saturate(175%);
  backdrop-filter: blur(28px) saturate(175%);
  border: 1px solid var(--stroke);
  border-radius: 26px;
  box-shadow: inset 0 1px 0 var(--hl), 0 18px 50px -20px var(--shadow), 0 2px 6px -2px var(--shadow);
}
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(140deg, var(--spec) 0%, transparent 32%, transparent 70%, var(--spec) 130%);
  opacity: 0.6;
}
.glass > * { position: relative; }

button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

.app {
  position: relative; z-index: 1; height: 100%;
  max-width: 1240px; margin: 0 auto;
  display: grid; grid-template-rows: minmax(0, 1fr); gap: 14px;
  padding-block: 64px calc(66px + env(safe-area-inset-bottom, 0px)); /* room for the toolbars (tools/toolbar.js) */
  box-sizing: border-box;
}

/* Subject view: fills the stage without scrolling. A compact header on top (or left);
   the dial takes the rest and is sized in script to fit both width and height. */
#view-subject { height: 100%; grid-template-rows: minmax(0, 1fr); align-content: stretch; }
.subject { height: 100%; box-sizing: border-box; padding: clamp(18px, 3vw, 34px); container-type: inline-size; overflow: hidden; }
.subject-grid { height: 100%; display: grid; grid-template-rows: fit-content(55%) minmax(0, 1fr); gap: 6px; }
@container (min-width: 720px) {
  .subject-grid { grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 28px; align-items: center; }
  .subject-text { max-height: 100%; }
}
.subject-text { display: grid; grid-auto-rows: max-content; gap: 8px; align-content: start; min-width: 0; min-height: 0; overflow: auto; scrollbar-width: thin; }
.subject-top { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.back-link { font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--muted); text-decoration: none; border-radius: 999px; }
.back-link:hover { color: var(--ink); }
@media (min-width: 901px) { .subject-top:has(.back-link) { display: none; } } /* desktop: the side orbit carries it */
.subject h1 { font-family: var(--display); font-weight: 600; text-wrap: balance; font-size: clamp(21px, 3vw, 36px); line-height: 1.12; letter-spacing: -0.025em; max-width: 26ch; margin: 0; }
.subject .lede { margin: 0; font-size: clamp(15px, 1.3vw, 16px); line-height: 1.5; max-width: 62ch;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.subject-date { display: none; margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.subject-text.open .lede { display: block; }
.subject-text.open .subject-date { display: block; }
/* Background (schema 5): researched facts about the Subject, shown with the full statement. */
.subject-bg { display: none; margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--hairline); gap: 6px; max-width: 62ch; }
.subject-text.open .subject-bg { display: grid; }
.subject-bg .bg-lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.subject-bg p { margin: 0; font-size: 14px; line-height: 1.5; }
.subject-bg .bg-src { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13px; color: var(--muted); }
.subject-bg .bg-src a { color: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); text-underline-offset: 2px; }
.subject-bg .bg-src a:hover { color: var(--ink); }
.more-btn { justify-self: start; border: 1px solid var(--stroke); background: var(--glass-strong); border-radius: 999px;
  padding: 4px 12px; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: inset 0 1px 0 var(--hl); }

/* Subject orbit: each pair faces the other across Framoid. --d (px) is set in script,
   and every part is sized from it, so the dial is always a true circle. */
.sorbit-wrap { min-width: 0; min-height: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.sorbit { --d: 300px; position: relative; flex: none; width: var(--d); height: var(--d); margin-block: 22px; }
.sorbit svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.sorbit .hoop { fill: none; stroke: var(--hairline); stroke-width: 0.5; }
.sorbit .axis { stroke-width: 1.2; stroke-linecap: round; opacity: 0.5; transition: opacity .3s, stroke-width .3s; }
.sorbit[data-hot] .axis { opacity: 0.14; }
.sorbit[data-hot] .axis.on { opacity: 1; stroke-width: 2; }
.snode {
  position: absolute; transform: translate(-50%, -50%);
  width: calc(var(--d) * 0.15); height: calc(var(--d) * 0.15); border-radius: 50%; padding: 0; cursor: pointer;
  border: 1px solid rgba(255, 255, 255, 0.55);
  background: radial-gradient(circle at 34% 28%, color-mix(in srgb, var(--c) 35%, white) 0%, var(--c) 62%, color-mix(in srgb, var(--c) 80%, black) 100%);
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.7), 0 10px 24px -8px color-mix(in srgb, var(--c) 75%, transparent);
  transition: transform .3s, opacity .3s;
}
.snode:hover, .snode:focus-visible { transform: translate(-50%, -50%) scale(1.08); }
.sorbit[data-hot] .snode:not(.on) { opacity: 0.4; }
.snode .lbl { position: absolute; left: 50%; transform: translateX(-50%); display: grid; justify-items: center; line-height: 1.15; white-space: nowrap; pointer-events: none; }
.snode.up .lbl { bottom: calc(100% + 6px); }
.snode.down .lbl { top: calc(100% + 6px); }
.snode .lbl strong { font-family: var(--rounded); font-size: 15px; font-weight: 700; color: var(--ct, var(--c)); }
.snode .lbl small { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.score {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: calc(var(--d) * 0.27); height: calc(var(--d) * 0.27); box-sizing: border-box; border-radius: 50%; padding: 6px; border: 0; cursor: pointer;
  background: conic-gradient(from 210deg, var(--rodim), var(--aromi), var(--mir), var(--ora), var(--idrom), var(--doria), var(--rodim));
  box-shadow: 0 12px 32px -10px var(--shadow);
  transition: transform .3s;
}
.score:hover, .score:focus-visible { transform: translate(-50%, -50%) scale(1.05); }
.score i {
  display: grid; place-content: center; gap: 1px; width: 100%; height: 100%; border-radius: 50%; font-style: normal; text-align: center;
  background: var(--glass-strong); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.score i b { font-family: var(--rounded); font-size: 16px; font-weight: 700; line-height: 1.1; }
.score i small { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); line-height: 1.2; }
.sorbit-cap { flex: none; margin: 0; min-height: 2.9em; max-width: 36ch; text-align: center; font-size: 13px; line-height: 1.45; color: var(--muted); }
.sorbit-cap strong { color: var(--ink); font-weight: 600; }
@media (hover: none) { .sorbit-cap { display: none; } }
/* Stances on the dial (schema 2+): every god keeps its colour; a small dot shows its stance
   (green embraces, red opposes; colours from the balance script). */
.snode .fb-sd { width: calc(var(--d) * 0.032); height: calc(var(--d) * 0.032); right: 4%; top: 4%; bottom: auto; border-width: 2px; }
/* Framoid's result (schema 2+, weighted by the balance of the gods): Framoid is an orb whose colour runs
   red → amber → green with the weighted share of the gods that embrace the Subject (--fc, set in script). */
.score.tallied { --fc: #b0a040; width: calc(var(--d) * 0.3); height: calc(var(--d) * 0.3); padding: 0; isolation: isolate;
  border: 1px solid rgba(255, 255, 255, 0.55);
  background: radial-gradient(circle at 34% 28%, color-mix(in srgb, var(--fc) 30%, white) 0%, var(--fc) 52%, color-mix(in srgb, var(--fc) 62%, black) 100%);
  box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.6), inset 0 calc(var(--d) * -0.03) calc(var(--d) * 0.05) rgba(0, 0, 0, 0.22),
    0 0 calc(var(--d) * 0.06) calc(var(--d) * 0.01) color-mix(in srgb, var(--fc) 60%, transparent),
    0 0 calc(var(--d) * 0.16) calc(var(--d) * 0.03) color-mix(in srgb, var(--fc) 30%, transparent);
  transition: transform .3s, background .5s, box-shadow .5s; animation: fb-aura 5s ease-in-out infinite; }
.score.tallied::before { content: ""; position: absolute; inset: 0; border-radius: 50%; opacity: .4; mix-blend-mode: soft-light; background-image: var(--fb-noise); background-size: 80px; pointer-events: none; }
.score.tallied::after { content: ""; position: absolute; left: 20%; top: 10%; width: 40%; height: 24%; border-radius: 50%; pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0) 70%); }
@keyframes fb-aura { 50% { box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.6), inset 0 calc(var(--d) * -0.03) calc(var(--d) * 0.05) rgba(0, 0, 0, 0.22),
    0 0 calc(var(--d) * 0.08) calc(var(--d) * 0.015) color-mix(in srgb, var(--fc) 70%, transparent),
    0 0 calc(var(--d) * 0.22) calc(var(--d) * 0.05) color-mix(in srgb, var(--fc) 34%, transparent); } }
.score.tallied i { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; position: relative; z-index: 1; }
.score.tallied i b { color: #fff; font-size: 15px; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35); }
.sorbit.small .score.tallied i b { font-size: 13px; }
.sorbit.small .snode .lbl strong { font-size: 13px; }
.sorbit.small .snode .lbl small { font-size: 10px; }
.sorbit.small .score i b { font-size: 14px; }
.sorbit.small .score i small { display: none; }

/* Shared type */
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }

/* Main */
body.fb-notop .app { padding-top: 14px; }
body.fb-stance .app { padding-bottom: calc(114px + env(safe-area-inset-bottom, 0px)); }
.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }

/* Stage */
.stage { min-height: 0; overflow: auto; padding: 2px 2px 8px; scrollbar-width: thin; }
.view { display: grid; gap: 14px; align-content: start; }
.view[hidden] { display: none; }
.view.enter { animation: enter .45s cubic-bezier(.2, .8, .2, 1); }
@keyframes enter { from { opacity: 0; transform: translateY(10px) scale(.99); } }
.view-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; padding: 2px 6px 0; }
.view-head h2 { font-family: var(--display); font-weight: 600; font-size: 21px; letter-spacing: -0.015em; margin: 0; }
.view-head .sub { font-size: 13px; font-weight: 600; color: var(--muted); }

.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.card { padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; min-width: 0; transition: box-shadow .4s; }
.card.ping { animation: ping 1s ease; }
@keyframes ping { 30% { box-shadow: inset 0 1px 0 var(--hl), 0 0 0 3px color-mix(in srgb, var(--c) 55%, transparent), 0 18px 50px -20px var(--shadow); } }
.god-row { display: flex; align-items: center; gap: 12px; }
.dot { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--c);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 18%, transparent), 0 0 16px color-mix(in srgb, var(--c) 60%, transparent); }
.god-name { font-family: var(--rounded); font-weight: 700; font-size: 27px; line-height: 1; letter-spacing: -0.01em; color: var(--c); margin: 0; }
.epithet { font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-left: auto; text-align: right; }
.stance { justify-self: start; align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; padding: 4px 12px; border-radius: 999px;
  color: var(--ct, var(--c)); background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
.stance.opp { color: var(--ink); background: transparent; border: 1.5px dashed color-mix(in srgb, var(--c) 70%, transparent); }
.question { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted); font-style: italic; text-wrap: balance; }
.answer { margin: 0; font-size: 16px; line-height: 1.55; }
.seg { display: inline-grid; grid-auto-flow: column; gap: 2px; padding: 4px; border-radius: 999px; background: var(--seg); justify-self: start; align-self: flex-start; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 16px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; transition: background .25s, color .25s; }
.seg button[aria-pressed="true"] { background: var(--glass-strong); color: var(--ct, var(--c)); box-shadow: 0 1px 4px var(--shadow), inset 0 1px 0 var(--hl); }
/* Instruments (schema 4): the means the god works through in this Reading. Claimed ones
   (not yet on the god's list) get a dashed outline and a small "claimed" note. */
.inst { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.inst-lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.tag { font-size: 12px; font-weight: 600; line-height: 1.3; padding: 4px 10px; border-radius: 999px; color: var(--ct, var(--c));
  background: color-mix(in srgb, var(--c) 10%, transparent); border: 1px solid color-mix(in srgb, var(--c) 28%, transparent); }
.tag.claimed { background: transparent; border-style: dashed; border-color: color-mix(in srgb, var(--c) 60%, transparent); }
.tag small { font-size: 10px; font-weight: 600; color: var(--muted); margin-left: 6px; }
.ii { display: grid; }
.ii p { grid-area: 1 / 1; margin: 0; font-size: 15px; line-height: 1.5; transition: opacity .25s; }
.ii p[aria-hidden="true"] { opacity: 0; visibility: hidden; }

.passage {
  grid-column: 1 / -1; padding: 18px 24px; display: grid; gap: 8px;
  border: 1.5px solid transparent;
  background: linear-gradient(var(--glass-strong), var(--glass-strong)) padding-box,
              linear-gradient(90deg, var(--a), var(--b)) border-box;
}
.passage-top { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; }
.passage-top .lbl { color: var(--muted); }
.passage-top .x { font-size: 16px; color: var(--muted); letter-spacing: 0; }
.passage p { margin: 0; font-size: 15px; max-width: 90ch; }

/* Directional Passage (schema 3): closes each Reading, runs from this god to its partner,
   and opens the partner's Reading when pressed. Bottom-aligned so both cards end level. */
.pass {
  margin-top: auto; display: grid; gap: 6px; text-align: left; cursor: pointer;
  padding: 12px 16px; border-radius: 18px; border: 1.5px solid transparent;
  background: linear-gradient(var(--glass-strong), var(--glass-strong)) padding-box,
              linear-gradient(90deg, var(--a), var(--b)) border-box;
  transition: transform .25s, box-shadow .25s;
}
.pass:hover { transform: translateY(-2px); box-shadow: 0 10px 24px -14px var(--shadow); }
.pass-top { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; }
.pass-top .lbl, .pass-top .arrow { color: var(--muted); }
.pass-top .arrow { font-size: 14px; letter-spacing: 0; }
.pass-text { font-size: 15px; line-height: 1.5; }

/* Framoid's view */

      if (mode === "sent") return `<h2 id="fac-title">Check your email</h2><p>We sent a sign-in link to <strong>${esc(ls.get(MAILKEY) || "")}</strong>. Open it on this device to finish signing in.</p>
        <div class="fb-row"><button type="button" class="fb-primary" data-fac="close">Done</button></div>`;
      return `<h2 id="fac-title">Sign in</h2>${note ? `<p class="fac-note">${esc(note)}</p>` : ""}
        <button type="button" class="fac-google" data-fac="google">${GLOGO}<span>Continue with Google</span></button>
        <form class="fac-form" data-fac-form="link"><input type="email" name="email" required autocomplete="email" placeholder="Or email me a link" aria-label="Email address for a sign-in link"><button type="submit">Send</button></form>
        <p class="fac-small">Syncs your balance, appearance and saved Reflections. <button type="button" class="flink" data-about>Privacy</button></p>`;
    };
    const render = () => { scrim.innerHTML = `<div class="fb-sheet fac" role="dialog" aria-modal="true" aria-labelledby="fac-title"><button type="button" class="fac-x" data-fac="close" aria-label="Close">&times;</button>${draw()}<p class="fb-status fac-status" aria-live="polite"></p></div>`; };
    if (!user) preload();
    render();
    document.body.appendChild(scrim);
    const status = t => { const s = scrim.querySelector(".fac-status"); if (s) s.textContent = t || ""; };
    let confirmDelete = false;
    const close = () => { if (!user) pending = null; scrim.remove(); document.removeEventListener("keydown", onKey); window.removeEventListener("framoid:account", onAcc); if (prev && prev.focus) prev.focus(); };
    const onKey = e => { if (e.key === "Escape") close(); };
    const onAcc = () => { if (note && user) return close(); mode = ""; render(); };
    document.addEventListener("keydown", onKey);
    window.addEventListener("framoid:account", onAcc);
    const fail = e => status((e && (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request")) ? "" : (e && e.code === "fac/not-ready") ? "Ready. Tap again." : (e && e.code === "auth/popup-blocked") ? "Your browser blocked the sign-in window. Allow pop-ups for framoid.com and try again." : "Couldn't complete that. Try again.");
    scrim.addEventListener("click", async e => {
      if (e.target === scrim) return close();
      const a = e.target.closest("[data-fac]"); if (!a) return;
      const act = a.dataset.fac;
      if (act === "close") return close();
      if (act === "google") { status(""); try { await google(); } catch (err) { console.warn("Framoid sign-in", err); fail(err); } return; }
      if (act === "signout") { await signOut(); return close(); }
      if (act === "delete") {
        if (!confirmDelete) { confirmDelete = true; a.textContent = "Tap again to delete everything"; status("This removes your account, settings and anything you saved. It can't be undone."); setTimeout(() => { confirmDelete = false; if (a.isConnected) { a.textContent = "Delete my account and data"; status(""); } }, 5000); return; }
        status("Deleting…");
        try { await deleteAll(); status("Your account and data are deleted."); setTimeout(close, 1200); } catch (err) { status("Couldn't delete everything. Sign in again and retry, or write to hello@framoid.com."); }
      }
    });
    scrim.addEventListener("submit", async e => {
      e.preventDefault();
      const f = e.target, email = f.email.value.trim(); if (!email) return;
      const btn = f.querySelector("button"); btn.disabled = true;
      try {
        if (f.dataset.facForm === "link") { status("Sending…"); await sendLink(email); mode = "sent"; render(); }
        else { status("Signing in…"); await finishLink(email); }
      } catch (err) { btn.disabled = false; status(f.dataset.facForm === "link" ? "Couldn't send the link. Check the address and try again." : "That link didn't work. It may have expired; request a new one."); }
    });
    const box = scrim.querySelector(".fac"); box.tabIndex = -1; box.style.outline = "none"; box.focus({ preventScroll: true });
  }

  /* ---------- styles ---------- */
  const css = `
.fb-sheet.fac { max-width: 360px; position: relative; }
.fb-sheet.fac h2 { margin-bottom: 14px; }
.fb-sheet.fac .fac-note { margin: -8px 0 14px; padding-right: 28px; }
.fac-x { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
  background: var(--hairline, rgba(20,24,40,.08)); color: var(--muted, #5c606e); font: 400 20px/30px var(--text, system-ui); }
.fac-google { width: 100%; height: 44px; margin-bottom: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
  border-radius: 999px; background: #fff; color: #1f1f1f; border: 1px solid #dadce0; font: 600 15px/1 var(--text, system-ui); }
.fb-sheet.fac p { font-size: 14px; line-height: 1.5; }
.fac-col { flex-direction: column; align-items: stretch; }
.fac-form { display: flex; gap: 8px; }
.fac-form input { flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; border: 1px solid var(--hairline, rgba(20,24,40,.15));
  background: var(--glass, rgba(255,255,255,.6)); color: var(--ink, #14151a); font: 400 16px/1 var(--text, system-ui); }
.fac-form button { flex: none; font: 600 14px/1 var(--text, system-ui); padding: 0 16px; border-radius: 999px; border: 1px solid var(--stroke, rgba(255,255,255,.7));
  background: var(--ink, #14151a); color: var(--bg, #fff); cursor: pointer; }
.fac-small { margin-top: 12px !important; text-align: center; font-size: 12px !important; color: var(--muted, #5c606e) !important; }
.fac-danger { color: var(--fb-no, #dc3b34) !important; }`;
  function addStyle() {
    if (document.getElementById("fac-style")) return;
    const el = document.createElement("style"); el.id = "fac-style"; el.textContent = css; document.head.appendChild(el);
  }

  /* ---------- start ---------- */
  // Only readers who signed in before (or arrive from an email link) load Firebase.
  if (ls.get(FLAG) || isLinkUrl()) {
    load().then(async ({ auth, A }) => {
      if (isLinkUrl() && A.isSignInWithEmailLink(auth, location.href)) {
        const email = ls.get(MAILKEY);
        if (email) { try { await finishLink(email); } catch { sheet("confirm-email"); } }
        else sheet("confirm-email");
      }
    }).catch(e => console.warn("Framoid: sign-in unavailable", e));
  }

  window.FramoidAccount = { state, open: () => sheet(""), signOut, preload, isSaved, toggleSave, stanceOf, setStance };
})();
</script><!-- balance:end -->

<script>
(async function () {
  const PANTHEON = {
    framoid: { name: "Framoid", epithet: "Undivided Source", q: "At what point does a distinction become a passage toward what it seemed to exclude?" },
    rodim: { name: "Rodim", epithet: "Spark of Will",    q: "What must yield for movement to become possible?" },
    aromi: { name: "Aromi", epithet: "Endless Flow",     q: "What form does movement choose when it responds completely to the present?" },
    mir:   { name: "Mir",   epithet: "Outer Horizon",    q: "What must take material form here, and what does that form make possible or impossible?" },
    ora:   { name: "Ora",   epithet: "Resonant Mind",    q: "What conception is seeking a body, and what experience is seeking meaning?" },
    idrom: { name: "Idrom", epithet: "Iron Law",         q: "When does an architecture begin to live?" },
    doria: { name: "Doria", epithet: "Living Harmony",   q: "What harmony lets this whole live without reducing the voices of its parts?" }
  };
  // The closing view keeps the hash #field so older links still work; it is shown as "Framoid".
  // VIEWS is the order of the tabs, the stepper and the arrow keys: Reflection, then Framoid, then the
  // pairs labelled by their gods' initials, so the sequence spells F·RA·MO·ID.
  const VIEWS = [
    { id: "subject",   title: "Reflection", tab: "Reflection", gods: [] },
    { id: "field",     title: "Framoid", tab: "Framoid", gods: [] },
    { id: "decision",  key: "decision_adaptation", title: "Decision and adaptation", tab: "RA", gods: ["rodim", "aromi"] },
    { id: "matter",    key: "mind_matter",         title: "Matter and mind",         tab: "MO", gods: ["mir", "ora"] },
    { id: "structure", key: "structure_harmony",   title: "Structure and harmony",   tab: "ID", gods: ["idrom", "doria"] }
  ];
  const PAIRS = VIEWS.filter(v => v.key);
  const ORDER = ["rodim", "aromi", "mir", "ora", "idrom", "doria"]; // side orbit, clockwise from top-left

  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const app = document.getElementById("app");
  // Content lives in reflection.json beside this page; design and data are kept apart.
  // Fallback: a <script id="reflection" type="application/json"> block in the page, if present.
  let R;
  try {
    const inline = document.getElementById("reflection");
    if (inline) R = JSON.parse(inline.textContent);
    else {
    const res = await fetch("reflection.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    R = await res.json();
    }
  } catch (e) {
    app.innerHTML = '<p style="padding:24px">The Reflection content (reflection.json) could not be loaded: ' + esc(e.message) + '</p>';
    return;
  }

  // schema 5: optional subject.background { brief, sources[{title, url}], preparedAt }, researched facts about the Subject.
  const BG = (R.subject && R.subject.background) || {};
  const bgLines = String(BG.brief || "").split(/\n+/).map(t => t.trim()).filter(Boolean);
  const bgSrc = (Array.isArray(BG.sources) ? BG.sources : []).filter(x => x && /^https?:\/\//.test(String(x.url || "")));
  const bgHtml = bgLines.length ? `<div class="subject-bg"><span class="bg-lbl">Background</span>${bgLines.map(t => `<p>${esc(t)}</p>`).join("")}${bgSrc.length
    ? `<div class="bg-src"><span>Sources:</span>${bgSrc.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title || x.url)}</a>`).join("")}</div>` : ""}</div>` : "";
  // On framoid.com (pages live at /r/<slug>/) a link leads back to the list; the Studio and previews have their own way back.
  const ONSITE = /^https?:$/.test(location.protocol) && /\/r\/[^/]+\/(index\.html)?$/.test(location.pathname);
  // Balance of the gods: Framoid's balance comes from the page (Studio preview: <script id="balance">, which
  // may also hide the reader's button) or from the site's /balance.json; a reader's own balance overrides it.
  const FB = window.FramoidBalance;
  let balFixed = false;
  const balEl = document.getElementById("balance");
  if (balEl) { try { const b = JSON.parse(balEl.textContent); FB.setMaster(b.weights || b); balFixed = !!b.fixed; } catch (e) {} }
  else if (ONSITE) FB.loadMaster("../../balance.json");
  const date = R.date ? new Date(R.date + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) : "";

  /* ---------- Readings ---------- */
  // schema 2: optional stance per Reading ("embraces" | "opposes"); schema 1 Reflections simply show no badge.
  const stance = st => st === "embraces" ? '<span class="stance">↑ Embraces</span>'
                     : st === "opposes"  ? '<span class="stance opp">↓ Opposes</span>' : "";
  // schema 3: pairs.<pair>.passage is { <god>: text } with one Passage from each god toward its partner.
  // Schema 1–2 Reflections keep a single passage string, shown as the older shared Passage card.
  const passOut = (from, to, text) => text ? `<button type="button" class="pass" data-to="${to}" style="--a: var(--${from}); --b: var(--${to})"
      aria-label="Passage from ${PANTHEON[from].name} to ${PANTHEON[to].name}: ${esc(text)} Open ${PANTHEON[to].name}'s Reading.">
      <span class="pass-top"><span class="lbl">Passage</span><span class="arrow">→</span><span style="color:var(--${to}-text)">${PANTHEON[to].name}</span></span>
      <span class="pass-text">${esc(text)}</span></button>` : "";
  // schema 4: optional "instruments" (from the god's list) and "claimed" (new, not yet on the list) per Reading.
  const instruments = (id, r) => {
    const own = Array.isArray(r.instruments) ? r.instruments : [], claimed = Array.isArray(r.claimed) ? r.claimed : [];
    if (!own.length && !claimed.length) return "";
    const n = PANTHEON[id].name;
    return `<div class="inst"><span class="inst-lbl">Instruments</span>${own.map(x => `<span class="tag">${esc(x)}</span>`).join("")}${claimed.map(x =>
      `<span class="tag claimed" title="Claimed Instrument: not yet on ${n}'s list">${esc(x)}<small>claimed</small></span>`).join("")}</div>`;
  };
  const reading = (id, r, pass = "") => {
    const g = PANTHEON[id];
    return `<article class="card glass" id="card-${id}" style="--c: var(--${id}); --ct: var(--${id}-text)">
      <div class="god-row"><span class="dot"></span><h3 class="god-name">${g.name}</h3><span class="epithet">${g.epithet}</span></div>
      ${stance(r.stance)}
      <p class="question">${g.q}</p>
      <p class="answer">${esc(r.answer)}</p>
      ${instruments(id, r)}
      <div class="seg" role="group" aria-label="${g.name}: impulse or imprint">
        <button type="button" id="seg-${id}-impulse" data-god="${id}" data-show="impulse" aria-pressed="true">Impulse</button>
        <button type="button" id="seg-${id}-imprint" data-god="${id}" data-show="imprint" aria-pressed="false">Imprint</button>
      </div>
      <div class="ii">
        <p data-part="impulse" aria-hidden="false">${esc(r.impulse)}</p>
        <p data-part="imprint" aria-hidden="true">${esc(r.imprint)}</p>
      </div>
      ${pass}
    </article>`;
  };

  const pairView = v => {
    const d = (R.pairs || {})[v.key] || {};
    const [a, b] = v.gods;
    const ps = d.passage;
    const split = ps && typeof ps === "object";
    return `<section class="view" id="view-${v.id}" aria-label="${v.title}">
      <div class="view-head"><h2>${v.title}</h2><span class="sub">${PANTHEON[a].name} ⇄ ${PANTHEON[b].name}</span></div>
      <div class="cards">
        ${reading(a, d[a] || {}, split ? passOut(a, b, ps[a]) : "")}${reading(b, d[b] || {}, split ? passOut(b, a, ps[b]) : "")}
        ${!split && ps ? `<div class="passage glass" style="--a: var(--${a}); --b: var(--${b})">
          <div class="passage-top"><span class="lbl">Passage</span><span style="color:var(--${a}-text)">${PANTHEON[a].name}</span><span class="x">⇄</span><span style="color:var(--${b}-text)">${PANTHEON[b].name}</span></div>
          <p>${esc(ps)}</p>
        </div>` : ""}
      </div>
    </section>`;
  };

  const f = R.field || {};
  const chipColors = { "Rodim · Aromi": ["rodim", "aromi"], "Ora · Mir": ["ora", "mir"], "Mir · Ora": ["mir", "ora"], "Idrom · Doria": ["idrom", "doria"] };
  const fieldView = `<section class="view" id="view-field" aria-label="Framoid">
    <div class="field glass">
      <div class="sigil" aria-hidden="true"></div>
      <div class="field-body">
        <span class="eyebrow">${PANTHEON.framoid.epithet}</span>
        <h2>Framoid</h2>
        <p class="question">${PANTHEON.framoid.q}</p>
        <div class="field-text">${(f.paragraphs || []).map(p => `<p>${esc(p)}</p>`).join("")}</div>
        ${(f.held || []).length ? `<span class="held-title">Held open</span><div class="held">${f.held.map(h => {
          // Each chip links to its pair: the pair is found from the god names in h.pairs.
          const names = String(h.pairs || "").toLowerCase();
          const pv = PAIRS.find(v => v.gods.every(g => names.includes(g)));
          const c = chipColors[h.pairs] || (pv ? pv.gods : []);
          const inner = `<span class="chip-top">${c.map(x => `<b style="background:var(--${x})"></b>`).join("")}${esc(h.pairs)}</span><p>${esc(h.text)}</p>`;
          return pv ? `<button type="button" class="chip" data-view="${pv.id}" aria-label="${esc(h.pairs)}: ${esc(h.text)} Open ${pv.title}.">${inner}</button>`
                    : `<div class="chip">${inner}</div>`;
        }).join("")}</div>` : ""}
        <p class="note">Each Reading speaks as one pure force. Framoid holds them together; it does not rank them.</p>
        <p class="note">${window.FramoidBar ? window.FramoidBar.disclaimerLine() : "Mostly AI-generated · Not advice"}</p>
      </div>
    </div>
  </section>`;

  /* ---------- Subject orbit ---------- */
  // Each pair sits on one diameter, so the two gods face each other across Framoid.
  // Upper triangle: Rodim, Mir, Idrom. Lower triangle: Aromi, Ora, Doria.
  const SANG = { rodim: -150, mir: -90, idrom: -30, aromi: 30, ora: 90, doria: 150 };
  const SR = 36;
  const SP = Object.fromEntries(Object.entries(SANG).map(([id, a]) => {
    const r = a * Math.PI / 180;
    return [id, { x: +(50 + SR * Math.cos(r)).toFixed(2), y: +(50 + SR * Math.sin(r)).toFixed(2) }];
  }));
  const pairOf = id => PAIRS.find(v => v.gods.includes(id));
  const sAxes = PAIRS.map(v => {
    const [a, b] = v.gods.map(g => SP[g]);
    return `<defs><linearGradient id="sg-${v.id}" gradientUnits="userSpaceOnUse" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}">
      <stop offset="0" stop-color="var(--${v.gods[0]})"/><stop offset="1" stop-color="var(--${v.gods[1]})"/></linearGradient></defs>
      <line class="axis" data-view="${v.id}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="url(#sg-${v.id})"/>`;
  }).join("");
  // Each god's stance, read from its Reading ("embraces" | "opposes"; absent in schema 1 data).
  const stanceOf = id => { const v = pairOf(id); return (((R.pairs || {})[v.key] || {})[id] || {}).stance; };
  const sNodes = Object.keys(SANG).map(id => {
    const p = SP[id], v = pairOf(id), g = PANTHEON[id], st = stanceOf(id);
    const word = st === "embraces" ? ", embraces the Subject" : st === "opposes" ? ", opposes the Subject" : "";
    return `<button type="button" class="snode ${p.y < 50 ? "up" : "down"}" id="snode-${id}" data-god="${id}" data-view="${v.id}"
      style="--c: var(--${id}); --ct: var(--${id}-text); left:${p.x}%; top:${p.y}%" aria-label="${g.name}, ${g.epithet}${word}: open ${v.title}">
      ${FB.dot(st)}<span class="lbl"><strong>${g.name}</strong><small>${g.epithet}</small></span></button>`;
  }).join("");
  // Framoid's result: the weighted share of the gods that embrace the Subject (see the balance script).
  const STANCES = Object.fromEntries(Object.keys(SANG).map(id => [id, stanceOf(id)]));
  const tide0 = FB.tide(STANCES), tallied = !!tide0;
  const coreLabel = t => t ? `Framoid: with the current balance of the gods, ${t.say}. Open its reflection` : "Framoid, Undivided Source: open its reflection";
  const coreInner = tallied ? `<b>Framoid</b>` : `<b>Framoid</b><small>Undivided<br>Source</small>`;
  const CAP0 = "Choose a god to open its pair, or Framoid to see them held together.";

  const subjectView = `<section class="view" id="view-subject" aria-label="Reflection">
    <div class="subject glass">
      <div class="subject-grid">
        <div class="subject-text" id="subject-text">
          <h1>${esc(R.subject?.title)}</h1>
          <p class="lede" id="subject-lede">${esc(R.subject?.statement)}</p>
          ${date ? `<p class="subject-date">${date}</p>` : ""}
          ${bgHtml}
          <button type="button" class="more-btn" id="subject-more" aria-expanded="false" aria-controls="subject-text">Show more</button>
        </div>
        <div class="sorbit-wrap">
          <div class="sorbit" id="sorbit">
            <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="hoop" cx="50" cy="50" r="${SR}"/>${sAxes}</svg>
            ${sNodes}
            <button type="button" class="score${tallied ? " tallied" : ""}" id="sorbit-framoid" aria-label="${coreLabel(tide0)}"${tallied ? ` style="--fc: ${tide0.color}"` : ""}><i>${coreInner}</i></button>
          </div>
          <p class="sorbit-cap" id="sorbit-cap" aria-live="polite">${CAP0}</p>
        </div>
      </div>
    </div>
  </section>`;

  app.innerHTML = `
    <div class="main">
      <main class="stage" id="stage">${subjectView}${fieldView}${PAIRS.map(pairView).join("")}</main>
    </div>
`;

  /* ---------- Toolbar (reading mode) ---------- */
  // Top right: previous / next Reflection and share. Bottom: home, the five sections, the balance of the gods.
  // In the Studio preview ("fixed" balance) only the sections show.
  const slug = ONSITE ? decodeURIComponent(location.pathname.split("/").filter(Boolean).filter(x => x !== "index.html").pop() || "") : "";
  const BAR = window.FramoidBar.reading({
    chrome: !balFixed, home: ONSITE ? "../../" : null, title: document.title,
    sections: VIEWS.map(v => ({ id: v.id, label: v.tab, icon: v.id === "subject" ? "reflection" : "", title: v.gods.length ? v.title : v.title, dots: v.gods })),
    onSection: id => show(indexOf(id)),
    prev: ONSITE ? null : undefined, next: ONSITE ? null : undefined, stances: tallied ? STANCES : null, slug: ONSITE ? slug : null
  });
  document.body.classList.toggle("fb-notop", !BAR.top);
  if (ONSITE) fetch("../../reflections.json", { cache: "no-cache" }).then(r => r.json()).then(j => {
    const list = j.reflections || [], i = list.findIndex(x => String(x.slug) === slug);
    const href = x => x ? `../../r/${encodeURIComponent(x.slug)}/` : null;
    if (i >= 0) BAR.setSteps(href(list[i - 1]), href(list[i + 1]));
  }).catch(() => {});

  /* ---------- Behaviour ---------- */
  const stage = document.getElementById("stage");

  let current = -1;
  function show(i, opts = {}) {
    i = (i + VIEWS.length) % VIEWS.length;
    const v = VIEWS[i];
    VIEWS.forEach((w, j) => {
      const el = document.getElementById("view-" + w.id);
      el.hidden = j !== i;
      el.classList.remove("enter");
    });
    const el = document.getElementById("view-" + v.id);
    if (current !== -1 && current !== i) { void el.offsetWidth; el.classList.add("enter"); stage.scrollTop = 0; }
    current = i;
    document.body.dataset.view = v.id;
    BAR.setCurrent(v.id);
    if (v.id === "subject") requestAnimationFrame(fit);
    if (location.hash !== "#" + v.id) { try { history.replaceState(null, "", "#" + v.id); } catch (e) {} }
    if (opts.god) {
      const card = document.getElementById("card-" + opts.god);
      if (card) {
        card.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "start" });
        card.classList.remove("ping"); void card.offsetWidth; card.classList.add("ping");
      }
    }
  }
  const indexOf = id => VIEWS.findIndex(v => v.id === id);

  // Subject orbit: pointing at a god lights its pair's axis and names the pair.
  const sorbit = document.getElementById("sorbit");
  const cap = document.getElementById("sorbit-cap");
  function hot(el) {
    sorbit.querySelectorAll(".snode, .axis").forEach(x => x.classList.remove("on"));
    if (!el) { delete sorbit.dataset.hot; cap.textContent = CAP0; return; }
    if (el.id === "sorbit-framoid") {
      sorbit.dataset.hot = "field";
      sorbit.querySelectorAll(".snode, .axis").forEach(x => x.classList.add("on"));
      cap.innerHTML = `<strong>Framoid</strong> · ${PANTHEON.framoid.epithet}<br>Holds all six Readings together`;
      return;
    }
    const v = VIEWS[indexOf(el.dataset.view)];
    sorbit.dataset.hot = v.id;
    sorbit.querySelectorAll(`.snode[data-view="${v.id}"], .axis[data-view="${v.id}"]`).forEach(x => x.classList.add("on"));
    cap.innerHTML = `<strong>${v.title}</strong><br>${v.gods.map(g => PANTHEON[g].name).join(" ⇄ ")}`;
  }
  sorbit.addEventListener("pointerover", e => hot(e.target.closest(".snode, .score")));
  sorbit.addEventListener("pointerleave", () => hot(null));
  sorbit.addEventListener("focusin", e => hot(e.target.closest(".snode, .score")));
  sorbit.addEventListener("focusout", () => hot(null));

  // Fit the dial to the space left beside or below the header, keeping it a true circle.
  const swrap = sorbit.parentElement;
  const stext = document.getElementById("subject-text");
  const lede = document.getElementById("subject-lede");
  const more = document.getElementById("subject-more");
  function fit() {
    const w = swrap.clientWidth, h = swrap.clientHeight;
    if (!w || !h) return;
    const LABELS = 44; // room for the name labels above the top orb and below the bottom one
    let d = Math.min(w - 26, h - cap.offsetHeight - LABELS - 4, 460);
    d = Math.max(Math.floor(d), 180);
    sorbit.style.setProperty("--d", d + "px");
    sorbit.classList.toggle("small", d < 300);
    if (!stext.classList.contains("open")) more.hidden = !(date || bgHtml || lede.scrollHeight > lede.clientHeight + 1);
  }
  if (window.ResizeObserver) { const ro = new ResizeObserver(fit); ro.observe(swrap); ro.observe(stext); }
  window.addEventListener("resize", fit);

  document.addEventListener("click", e => {
    const seg = e.target.closest(".seg button");
    if (seg) {
      const card = seg.closest(".card");
      card.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b === seg)));
      card.querySelectorAll(".ii p").forEach(p => p.setAttribute("aria-hidden", String(p.dataset.part !== seg.dataset.show)));
      return;
    }
    if (e.target.closest("#subject-more")) {
      const open = stext.classList.toggle("open");
      more.textContent = open ? "Show less" : "Show more";
      more.setAttribute("aria-expanded", String(open));
      return;
    }
    // A directional Passage opens the partner's Reading: on phones it swipes the row to that card,
    // on wider screens (both cards visible) it highlights it.
    const pass = e.target.closest(".pass");
    if (pass) {
      const card = document.getElementById("card-" + pass.dataset.to);
      if (card) {
        const phone = window.matchMedia("(max-width: 900px)").matches;
        card.scrollIntoView({ behavior: "smooth", block: phone ? "start" : "nearest", inline: "start" });
        card.classList.remove("ping"); void card.offsetWidth; card.classList.add("ping");
      }
      return;
    }
    const chip = e.target.closest("button.chip");
    if (chip) { show(indexOf(chip.dataset.view)); return; }
    const sn = e.target.closest(".snode");
    if (sn) { show(indexOf(sn.dataset.view), { god: sn.dataset.god }); return; }
    if (e.target.closest("#sorbit-framoid")) { show(indexOf("field")); return; }
  });
  document.addEventListener("keydown", e => {
    if (e.altKey || e.metaKey || e.ctrlKey) return;
    if (e.key === "ArrowRight") show(current + 1);
    if (e.key === "ArrowLeft") show(current - 1);
  });
  window.addEventListener("hashchange", () => { const i = indexOf(location.hash.slice(1)); if (i >= 0 && i !== current) show(i); });

  // The centre follows the balance of the gods as it changes (here, in another tab, or when /balance.json arrives).
  const score = document.getElementById("sorbit-framoid");
  window.addEventListener("framoid:balance", () => {
    const t = FB.tide(STANCES); if (!t) return;
    score.style.setProperty("--fc", t.color); score.setAttribute("aria-label", coreLabel(t));
  });

  const start = indexOf(location.hash.slice(1));
  show(start >= 0 ? start : 0);
})();
</script>
</body>
</html>
