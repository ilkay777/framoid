<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Framoid Reflection 17: A country bans social media for under-16s</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one screen. Home is an endless feed of Reflections (one per swipe) with the dial fixed beneath it;
   the dial follows the Reflection in view. A god or Framoid on the dial opens that pair or Framoid's reflection,
   and the dial shrinks to the bottom right. Toolbars are floating islands (tools/toolbar.js).
   Colour fields behind the glass shift to the gods in view. On phones each pair is a swipeable row of cards. */
@property --b1 { syntax: "<color>"; inherits: true; initial-value: #b8461f; }
@property --b2 { syntax: "<color>"; inherits: true; initial-value: #1f6e86; }
@property --b3 { syntax: "<color>"; inherits: true; initial-value: #5b4a9e; }

:root {
  --bg: #eceef4;
  --ink: #14151a;
  --muted: #5c606e;
  --glass: rgba(255, 255, 255, 0.5);
  --glass-strong: rgba(255, 255, 255, 0.78);
  --seg: rgba(20, 24, 40, 0.06);
  --stroke: rgba(255, 255, 255, 0.7);
  --hairline: rgba(20, 24, 40, 0.08);
  --hl: rgba(255, 255, 255, 0.95);
  --spec: rgba(255, 255, 255, 0.55);
  --shadow: rgba(30, 36, 70, 0.14);
  --blob: 0.5;
  --focus: #0a6cff;

  --rodim: #c4461a;
  --aromi: #13789a;
  --mir:   #95661d;
  --ora:   #5e47b8;
  --idrom: #4b5b6d;
  --doria: #2f8443;
  /* Text shades: god colours as small text (badges, tags, labels) at 4.5:1 or better on glass.
     Orbs, large names and fills keep the god colour itself. */
  --rodim-text: #a73b16; --aromi-text: #106784; --mir-text: #805819; --doria-text: #276e38;
  --ora-text: var(--ora); --idrom-text: var(--idrom);

  --text: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: var(--text);
  --rounded: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08090d; --ink: #f3f3f6; --muted: #9ea2b0;
    --glass: rgba(30, 32, 42, 0.46); --glass-strong: rgba(58, 61, 74, 0.7); --seg: rgba(255, 255, 255, 0.07);
    --stroke: rgba(255, 255, 255, 0.13); --hairline: rgba(255, 255, 255, 0.08);
    --hl: rgba(255, 255, 255, 0.2); --spec: rgba(255, 255, 255, 0.1); --shadow: rgba(0, 0, 0, 0.5);
    --blob: 0.42; --focus: #5aa2ff;
    --rodim: #ff7a45; --aromi: #4cc3e6; --mir: #e0ae5c; --ora: #a996ff; --idrom: #a6b6c8; --doria: #6fd284;
    --rodim-text: var(--rodim); --aromi-text: var(--aromi); --mir-text: var(--mir); --doria-text: var(--doria);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08090d; --ink: #f3f3f6; --muted: #9ea2b0;
  --glass: rgba(30, 32, 42, 0.46); --glass-strong: rgba(58, 61, 74, 0.7); --seg: rgba(255, 255, 255, 0.07);
  --stroke: rgba(255, 255, 255, 0.13); --hairline: rgba(255, 255, 255, 0.08);
  --hl: rgba(255, 255, 255, 0.2); --spec: rgba(255, 255, 255, 0.1); --shadow: rgba(0, 0, 0, 0.5);
  --blob: 0.42; --focus: #5aa2ff;
  --rodim: #ff7a45; --aromi: #4cc3e6; --mir: #e0ae5c; --ora: #a996ff; --idrom: #a6b6c8; --doria: #6fd284;
  --rodim-text: var(--rodim); --aromi-text: var(--aromi); --mir-text: var(--mir); --doria-text: var(--doria);
  color-scheme: dark;
}

html, body { height: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--text); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  transition: --b1 1.1s ease, --b2 1.1s ease, --b3 1.1s ease;
}
body[data-view="subject"]   { --b1: var(--aromi); --b2: var(--doria); --b3: var(--rodim); }
body[data-view="decision"]  { --b1: var(--rodim); --b2: var(--aromi); --b3: var(--ora); }
body[data-view="matter"]    { --b1: var(--mir);   --b2: var(--ora);   --b3: var(--aromi); }
body[data-view="structure"] { --b1: var(--idrom); --b2: var(--doria); --b3: var(--mir); }
body[data-view="field"]     { --b1: var(--mir);   --b2: var(--doria); --b3: var(--rodim); }

/* Colour fields behind the glass */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: var(--blob); }
.blob.a { width: 52vmax; height: 52vmax; top: -18vmax; left: -12vmax; background: var(--b1); animation: drift-a 28s ease-in-out infinite alternate; }
.blob.b { width: 50vmax; height: 50vmax; bottom: -22vmax; right: -14vmax; background: var(--b2); animation: drift-b 32s ease-in-out infinite alternate; }
.blob.c { width: 30vmax; height: 30vmax; top: 34%; left: 44%; background: var(--b3); opacity: calc(var(--blob) * 0.6); animation: drift-c 24s ease-in-out infinite alternate; }
@keyframes drift-a { to { transform: translate(8vmax, 6vmax) scale(1.08); } }
@keyframes drift-b { to { transform: translate(-7vmax, -5vmax) scale(0.94); } }
@keyframes drift-c { to { transform: translate(-10vmax, 4vmax) scale(1.15); } }

/* Glass material */
.glass {
  position: relative;
  background: var(--glass);
  -webkit-backdrop-filter: blur(28px) saturate(175%);
  backdrop-filter: blur(28px) saturate(175%);
  border: 1px solid var(--stroke);
  border-radius: 26px;
  box-shadow: inset 0 1px 0 var(--hl), 0 18px 50px -20px var(--shadow), 0 2px 6px -2px var(--shadow);
}
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(140deg, var(--spec) 0%, transparent 32%, transparent 70%, var(--spec) 130%);
  opacity: 0.6;
}
.glass > * { position: relative; }

button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

.app {
  --dock: clamp(170px, 30vh, 260px); --barh: 2px;
  position: relative; z-index: 1; height: 100%; height: 100dvh;
  max-width: 1240px; margin: 0 auto;
  display: flex; flex-direction: column;
  /* room for the dial and the bottom toolbar (tools/toolbar.js), both fixed to the bottom of the screen */
  padding: 0;
  box-sizing: border-box;
}
body.reading .app { padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)); }
body.studio .app { --barh: 6px; }

/* Home: an endless feed of Reflections, newest first, one per page; swipe left / right (snaps). Each page is flat and
   scrolls on its own: the title stays pinned at the top (text passes under it, blurred), with room at the end to scroll
   every line clear of the toolbar and the dial. */
.feed { flex: 1 1 auto; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; }
.feed::-webkit-scrollbar { display: none; }
.item { flex: 0 0 100%; height: 100%; box-sizing: border-box; scroll-snap-align: start; scroll-snap-stop: always; overflow-y: auto; overscroll-behavior-y: contain; scrollbar-width: none;
  padding: 0 clamp(20px, 5vw, 40px) calc(180px + env(safe-area-inset-bottom, 0px)); }
.item::-webkit-scrollbar { display: none; }
.subject { max-width: 720px; margin: 0 auto; }
.subject-text { display: grid; grid-auto-rows: max-content; gap: 10px; min-width: 0; }
.subject h1 { position: sticky; top: 0; z-index: 2; margin: 0 -12px; padding: calc(16px + env(safe-area-inset-top, 0px)) 12px 12px;
  font-family: var(--display); font-weight: 600; text-wrap: balance; font-size: clamp(22px, 3vw, 32px); line-height: 1.12; letter-spacing: -0.025em;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  -webkit-mask-image: linear-gradient(#000 calc(100% - 14px), transparent); mask-image: linear-gradient(#000 calc(100% - 14px), transparent); }
.subject .lede { margin: 0; font-size: clamp(16px, 1.4vw, 17px); line-height: 1.55; max-width: 62ch; }
.subject-date { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
/* Background (schema 5): researched facts about the Subject. */
.subject-bg { display: grid; margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--hairline); gap: 8px; max-width: 62ch; }
.subject-bg .bg-lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.subject-bg p { margin: 0; font-size: 15px; line-height: 1.55; }
.subject-bg .bg-src { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13px; color: var(--muted); }
.subject-bg .bg-src a { color: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); text-underline-offset: 2px; }
.subject-bg .bg-src a:hover { color: var(--ink); }

.feed-msg { margin: auto; color: var(--muted); }

/* The dial (tools/balance.js, one dial in two modes): a small disc (the toolbar's surface) at the bottom right, gods all the same size,
   no names. Framoid is the knob: hold it for the stance rail (left / right: your stance, down: the Pantheon's, up: tune).
   Tuning brings it to the middle, larger, with the gods placed and sized by weight; the toolbar keeps only Home. */
.dock { position: fixed; z-index: 31; --dock: 150px; width: var(--dock); height: var(--dock); box-sizing: border-box; padding: 3px; border-radius: 50%;
  right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: center; align-items: center;
  /* the same surface as the toolbar islands (tools/toolbar.js .fisl) */
  background: var(--glass-strong); border: 1px solid var(--stroke);
  -webkit-backdrop-filter: blur(20px) saturate(175%); backdrop-filter: blur(20px) saturate(175%);
  box-shadow: inset 0 1px 0 var(--hl), 0 8px 24px -10px var(--shadow);
  transition: width .25s ease, height .25s ease, right .25s ease, bottom .25s ease; }
.dial { width: 100%; height: 100%; }
.dial .fb-dial { width: 100%; height: 100%; max-width: none; margin: 0; }
.dial .fb-dial .name { font-size: 19px; }
.dial .fb-dial .core-lbl { font-size: 17px; }
.dial .fb-dial .fb-cue { font-size: 16px; }
.dial.fb-compact .fb-dial .core-lbl { display: none; }
.dial.fb-tuning .spoke { stroke: var(--muted); stroke-opacity: .35; }
body.tuning .dock { --dock: min(92vw, 420px, calc(100dvh - 120px)); padding: 6px;
  right: calc(50% - var(--dock) / 2); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
.dial[data-view="decision"] .orb:not([data-god="rodim"]):not([data-god="aromi"]),
.dial[data-view="matter"] .orb:not([data-god="mir"]):not([data-god="ora"]),
.dial[data-view="structure"] .orb:not([data-god="idrom"]):not([data-god="doria"]) { opacity: .3 !important; }

/* A pair or Framoid's reflection, opened from the dial */
.reader { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 2px 2px calc(170px + env(safe-area-inset-bottom, 0px)); scrollbar-width: thin; }

/* Shared type */
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }

/* Views */
.view { display: grid; gap: 14px; align-content: start; }
.view[hidden] { display: none; }
.view.enter { animation: enter .45s cubic-bezier(.2, .8, .2, 1); }
@keyframes enter { from { opacity: 0; transform: translateY(10px) scale(.99); } }
.view-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; padding: 2px 6px 0; }
.view-head h2 { font-family: var(--display); font-weight: 600; font-size: 21px; letter-spacing: -0.015em; margin: 0; }
.view-head .sub { font-size: 13px; font-weight: 600; color: var(--muted); }

.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.card { padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; min-width: 0; transition: box-shadow .4s; }
.card.ping { animation: ping 1s ease; }
@keyframes ping { 30% { box-shadow: inset 0 1px 0 var(--hl), 0 0 0 3px color-mix(in srgb, var(--c) 55%, transparent), 0 18px 50px -20px var(--shadow); } }
.god-row { display: flex; align-items: center; gap: 12px; }
.dot { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--c);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 18%, transparent), 0 0 16px color-mix(in srgb, var(--c) 60%, transparent); }
.god-name { font-family: var(--rounded); font-weight: 700; font-size: 27px; line-height: 1; letter-spacing: -0.01em; color: var(--c); margin: 0; }
.epithet { font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-left: auto; text-align: right; }
.stance { justify-self: start; align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; padding: 4px 12px; border-radius: 999px;
  color: var(--ct, var(--c)); background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
.stance.opp { color: var(--ink); background: transparent; border: 1.5px dashed color-mix(in srgb, var(--c) 70%, transparent); }
.question { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted); font-style: italic; text-wrap: balance; }
.answer { margin: 0; font-size: 16px; line-height: 1.55; }
.seg { display: inline-grid; grid-auto-flow: column; gap: 2px; padding: 4px; border-radius: 999px; background: var(--seg); justify-self: start; align-self: flex-start; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 16px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; transition: background .25s, color .25s; }
.seg button[aria-pressed="true"] { background: var(--glass-strong); color: var(--ct, var(--c)); box-shadow: 0 1px 4px var(--shadow), inset 0 1px 0 var(--hl); }
/* Instruments (schema 4): the means the god works through in this Reading. Claimed ones
   (not yet on the god's list) get a dashed outline and a small "claimed" note. */
.inst { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.inst-lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.tag { font-size: 12px; font-weight: 600; line-height: 1.3; padding: 4px 10px; border-radius: 999px; color: var(--ct, var(--c));
  background: color-mix(in srgb, var(--c) 10%, transparent); border: 1px solid color-mix(in srgb, var(--c) 28%, transparent); }
.tag.claimed { background: transparent; border-style: dashed; border-color: color-mix(in srgb, var(--c) 60%, transparent); }
.tag small { font-size: 10px; font-weight: 600; color: var(--muted); margin-left: 6px; }
.ii { display: grid; }
.ii p { grid-area: 1 / 1; margin: 0; font-size: 15px; line-height: 1.5; transition: opacity .25s; }
.ii p[aria-hidden="true"] { opacity: 0; visibility: hidden; }

.passage {
  grid-column: 1 / -1; padding: 18px 24px; display: grid; gap: 8px;
  border: 1.5px solid transparent;
  background: linear-gradient(var(--glass-strong), var(--glass-strong)) padding-box,
              linear-gradient(90deg, var(--a), var(--b)) border-box;
}
.passage-top { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; }
.passage-top .lbl { color: var(--muted); }
.passage-top .x { font-size: 16px; color: var(--muted); letter-spacing: 0; }
.passage p { margin: 0; font-size: 15px; max-width: 90ch; }

/* Directional Passage (schema 3): closes each Reading, runs from this god to its partner,
   and opens the partner's Reading when pressed. Bottom-aligned so both cards end level. */
.pass {
  margin-top: auto; display: grid; gap: 6px; text-align: left; cursor: pointer;
  padding: 12px 16px; border-radius: 18px; border: 1.5px solid transparent;
  background: linear-gradient(var(--glass-strong), var(--glass-strong)) padding-box,
              linear-gradient(90deg, var(--a), var(--b)) border-box;
  transition: transform .25s, box-shadow .25s;
}
.pass:hover { transform: translateY(-2px); box-shadow: 0 10px 24px -14px var(--shadow); }
.pass-top { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; }
.pass-top .lbl, .pass-top .arrow { color: var(--muted); }
.pass-top .arrow { font-size: 14px; letter-spacing: 0; }
.pass-text { font-size: 15px; line-height: 1.5; }

/* Framoid's view */
.field { padding: 28px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: start; }
.sigil { width: 140px; aspect-ratio: 1; max-width: 100%; border-radius: 50%; position: relative;
  background: conic-gradient(from 210deg, var(--rodim), var(--aromi), var(--mir), var(--ora), var(--idrom), var(--doria), var(--rodim));
  animation: spin 80s linear infinite; }
.sigil::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; background: inherit; filter: blur(22px); opacity: .45; z-index: -1; }
.sigil::after { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: var(--glass-strong); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
@keyframes spin { to { transform: rotate(360deg); } }
.field-body { display: grid; gap: 12px; min-width: 0; }
.field-body h2 { font-family: var(--display); font-weight: 700; font-size: 32px; letter-spacing: -0.025em; margin: 0; line-height: 1.05; }
.field-body .question { font-size: 15px; }
.field-text { display: grid; gap: 10px; max-width: 75ch; }
.field-text p { margin: 0; font-size: 16px; }
.held-title { font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.held { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.chip { padding: 12px 14px; border-radius: 18px; background: var(--glass-strong); border: 1px solid var(--stroke); box-shadow: inset 0 1px 0 var(--hl); display: grid; gap: 6px; align-content: start; }
.chip-top { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
.chip-top b { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
button.chip { font: inherit; color: inherit; text-align: left; cursor: pointer; transition: transform .25s, box-shadow .25s; }
button.chip:hover { transform: translateY(-2px); box-shadow: inset 0 1px 0 var(--hl), 0 10px 24px -14px var(--shadow); }
.chip p { margin: 0; font-size: 14px; line-height: 1.45; }
.note { font-size: 13px; color: var(--muted); margin: 4px 0 0; }

@media (max-width: 900px) {
  .cards { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 88%; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 10px; scrollbar-width: none; }
  .cards::-webkit-scrollbar { display: none; }
  .card { scroll-snap-align: start; padding: 20px; }
  /* The Passage is the last card in the swipe row: it snaps by its end edge, since the row
     cannot scroll far enough for its start edge to reach the left side. */
  .passage { grid-column: auto; align-content: start; scroll-snap-align: end; }
  .field { grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 22px 20px; }
  .sigil { width: 72px; }
  .held { grid-template-columns: minmax(0, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<!-- balance:start --><script id="fb-balance">
/* Framoid balance: how much each god's Reading counts. Shared by framoid.com (home and every Reflection
   page) and the Studio; tools/sync_balance.py copies this file into each page between the balance markers.
   30 points are shared by the six gods, but no number is ever shown. On the dial, a god nearer Framoid
   counts more; pulling one in pushes the others out in proportion (one shared pool), and a god on the rim
   counts for nothing. Framoid's balance (the master profile) is set in the Studio and published as
   /balance.json; a reader may change it for themselves (kept in their browser, for every page).
   The result is Framoid's own colour: on a Reflection its orb shades from red (opposed) through amber
   (balanced) to green (embraced) with the weighted share of the gods that embrace the Subject; elsewhere it
   blends the gods' colours. The gods keep their colours, with a small red or green dot for their stance. */
(function () {
  "use strict";
  if (window.FramoidBalance) return;
  const GODS = ["rodim", "mir", "idrom", "aromi", "ora", "doria"];
  const NAME = { rodim: "Rodim", aromi: "Aromi", mir: "Mir", ora: "Ora", idrom: "Idrom", doria: "Doria" };
  const ANG = { rodim: -150, mir: -90, idrom: -30, aromi: 30, ora: 90, doria: 150 }; // as on the Subject dial
  const T = 30, RIN = 82, ROUT = 182, E = 0.39, KEY = "framoid.balance";
  const equal = () => Object.fromEntries(GODS.map(g => [g, T / 6]));
  // Any set of non-negative weights, scaled so they add up to 30. All zero (or nothing) means equal.
  function norm(w) {
    const v = Object.fromEntries(GODS.map(g => [g, Math.max(0, Number(w && w[g]) || 0)]));
    const s = GODS.reduce((a, g) => a + v[g], 0);

  function sheet(mode, note) {

        <div class="fb-row fac-col"><button type="button" data-fac="signout">Sign out</button><button type="button" class="fac-danger" data-fac="delete">Delete my account and data</button><button type="button" class="fb-primary" data-fac="close">Done</button></div>`;
      if (mode === "confirm-email") return `<h2 id="fac-title">Finish signing in</h2><p>Enter the email address the sign-in link was sent to.</p>

        <button type="button" class="fac-google" data-fac="google">${GLOGO}<span>Continue with Google</span></button>
        <form class="fac-form" data-fac-form="link"><input type="email" name="email" required autocomplete="email" placeholder="Or email me a link" aria-label="Email address for a sign-in link"><button type="submit">Send</button></form>
        <p class="fac-small">Syncs your balance, appearance and saved Reflections. <button type="button" class="flink" data-about>Privacy</button></p>`;
    };
    const render = () => { scrim.innerHTML = `<div class="fb-sheet fac" role="dialog" aria-modal="true" aria-labelledby="fac-title"><button type="button" class="fac-x" data-fac="close" aria-label="Close">&times;</button>${draw()}<p class="fb-status fac-status" aria-live="polite"></p></div>`; };
    if (!user) preload();
    render();
    document.body.appendChild(scrim);
    const status = t => { const s = scrim.querySelector(".fac-status"); if (s) s.textContent = t || ""; };
    let confirmDelete = false;
    const close = () => { if (!user) pending = null; scrim.remove(); document.removeEventListener("keydown", onKey); window.removeEventListener("framoid:account", onAcc); if (prev && prev.focus) prev.focus(); };
    const onKey = e => { if (e.key === "Escape") close(); };

    document.addEventListener("keydown", onKey);

    const fail = e => status((e && (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request")) ? "" : (e && e.code === "fac/not-ready") ? "Ready. Tap again." : (e && e.code === "auth/popup-blocked") ? "Your browser blocked the sign-in window. Allow pop-ups for framoid.com and try again." : "Couldn't complete that. Try again.");
    scrim.addEventListener("click", async e => {

      const act = a.dataset.fac;

      if (act === "signout") { await signOut(); return close(); }
      if (act === "delete") {
        if (!confirmDelete) { confirmDelete = true; a.textContent = "Tap again to delete everything"; status("This removes your account, settings and anything you saved. It can't be undone."); setTimeout(() => { confirmDelete = false; if (a.isConnected) { a.textContent = "Delete my account and data"; status(""); } }, 5000); return; }
        status("Deleting…");

      e.preventDefault();
      const f = e.target, email = f.email.value.trim(); if (!email) return;
      const btn = f.querySelector("button"); btn.disabled = true;
      try {
        if (f.dataset.facForm === "link") { status("Sending…"); await sendLink(email); mode = "sent"; render(); }

  /* ---------- styles ---------- */
  const css = `
.fb-sheet.fac { max-width: 360px; position: relative; }
.fb-sheet.fac h2 { margin-bottom: 14px; }
.fb-sheet.fac .fac-note { margin: -8px 0 14px; padding-right: 28px; }
.fac-x { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
  background: var(--hairline, rgba(20,24,40,.08)); color: var(--muted, #5c606e); font: 400 20px/30px var(--text, system-ui); }
.fac-google { width: 100%; height: 44px; margin-bottom: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
  border-radius: 999px; background: #fff; color: #1f1f1f; border: 1px solid #dadce0; font: 600 15px/1 var(--text, system-ui); }
.fb-sheet.fac p { font-size: 14px; line-height: 1.5; }
.fac-col { flex-direction: column; align-items: stretch; }
.fac-form { display: flex; gap: 8px; }
.fac-form input { flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; border: 1px solid var(--hairline, rgba(20,24,40,.15));
  background: var(--glass, rgba(255,255,255,.6)); color: var(--ink, #14151a); font: 400 16px/1 var(--text, system-ui); }
.fac-form button { flex: none; font: 600 14px/1 var(--text, system-ui); padding: 0 16px; border-radius: 999px; border: 1px solid var(--stroke, rgba(255,255,255,.7));
  background: var(--ink, #14151a); color: var(--bg, #fff); cursor: pointer; }
.fac-small { margin-top: 12px !important; text-align: center; font-size: 12px !important; color: var(--muted, #5c606e) !important; }
.fac-danger { color: var(--fb-no, #dc3b34) !important; }`;
  function addStyle() {
    if (document.getElementById("fac-style")) return;
    const el = document.createElement("style"); el.id = "fac-style"; el.textContent = css; document.head.appendChild(el);
  }

  /* ---------- start ---------- */
  // Only readers who signed in before (or arrive from an email link) load Firebase.
  if (ls.get(FLAG) || isLinkUrl()) {
    load().then(async ({ auth, A }) => {
      if (isLinkUrl() && A.isSignInWithEmailLink(auth, location.href)) {
        const email = ls.get(MAILKEY);
        if (email) { try { await finishLink(email); } catch { sheet("confirm-email"); } }
        else sheet("confirm-email");
      }
    }).catch(e => console.warn("Framoid: sign-in unavailable", e));
  }

  window.FramoidAccount = { state, open: () => sheet(""), signOut, preload, isSaved, toggleSave, stanceOf, setStance };
})();

<script>
(async function () {
  const PANTHEON = {
    framoid: { name: "Framoid", epithet: "Undivided Source", q: "At what point does a distinction become a passage toward what it seemed to exclude?" },
    rodim: { name: "Rodim", epithet: "Spark of Will",    q: "What must yield for movement to become possible?" },
    aromi: { name: "Aromi", epithet: "Endless Flow",     q: "What form does movement choose when it responds completely to the present?" },
    mir:   { name: "Mir",   epithet: "Outer Horizon",    q: "What must take material form here, and what does that form make possible or impossible?" },
    ora:   { name: "Ora",   epithet: "Resonant Mind",    q: "What conception is seeking a body, and what experience is seeking meaning?" },
    idrom: { name: "Idrom", epithet: "Iron Law",         q: "When does an architecture begin to live?" },
    doria: { name: "Doria", epithet: "Living Harmony",   q: "What harmony lets this whole live without reducing the voices of its parts?" }
  };
  // Views of one Reflection, opened from the dial. "subject" is the feed itself; the others open in the reader.
  // The closing view keeps the hash #field so older links still work; it is shown as "Framoid".
  const VIEWS = [
    { id: "subject",   title: "Reflection", gods: [] },
    { id: "field",     title: "Framoid", gods: [] },
    { id: "decision",  key: "decision_adaptation", title: "Decision and adaptation", gods: ["rodim", "aromi"] },
    { id: "matter",    key: "mind_matter",         title: "Matter and mind",         gods: ["mir", "ora"] },
    { id: "structure", key: "structure_harmony",   title: "Structure and harmony",   gods: ["idrom", "doria"] }
  ];
  const PAIRS = VIEWS.filter(v => v.key);
  const READER = VIEWS.filter(v => v.id !== "subject");
  const GODS = ["rodim", "aromi", "mir", "ora", "idrom", "doria"];
  const pairOf = id => PAIRS.find(v => v.gods.includes(id));
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const app = document.getElementById("app");
  const FB = window.FramoidBalance;

  /* ---------- data ---------- */
  // On framoid.com every page is this app: "/" starts at the newest Reflection, "/r/<slug>/" at that one.
  // The feed comes from /reflections.json; each Reflection's full text from /r/<slug>/reflection.json when needed.
  // The Studio (and the template preview) put one Reflection inline: <script id="reflection" type="application/json">.
  const inline = document.getElementById("reflection");
  const ONSITE = !inline && /^https?:$/.test(location.protocol);
  const pathSlug = (location.pathname.match(/\/r\/([^/]+)\/(index\.html)?$/) || [])[1];
  const stancesOf = R => { const o = {}; PAIRS.forEach(v => v.gods.forEach(g => { const st = (((R.pairs || {})[v.key] || {})[g] || {}).stance; if (st) o[g] = st; })); return o; };
  const fromFull = (R, slug) => ({ slug: slug || String(R.number || ""), number: String(R.number || ""), date: R.date || "", title: (R.subject || {}).title || "",
    statement: (R.subject || {}).statement || "", stances: stancesOf(R), full: Promise.resolve(R) });
  let items = [];
  try {
    if (inline) items = [fromFull(JSON.parse(inline.textContent), "")];
    else {
      const res = await fetch("/reflections.json", { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      items = ((await res.json()).reflections || []).map(x => Object.assign({}, x, { slug: String(x.slug) }));
    }
  } catch (e) {
    try { const r = await fetch("reflection.json", { cache: "no-store" }); if (!r.ok) throw e; items = [fromFull(await r.json(), pathSlug || "")]; }
    catch (e2) { app.innerHTML = '<p style="padding:24px">The Reflections could not be loaded: ' + esc(e.message) + '</p>'; return; }
  }
  const full = it => it.full || (it.full = fetch(`/r/${encodeURIComponent(it.slug)}/reflection.json`, { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }));
  const isTallied = st => GODS.every(g => st && (st[g] === "embraces" || st[g] === "opposes"));

  // Balance of the gods: Framoid's balance from the page (Studio preview: <script id="balance">, which also hides the
  // reader's chrome) or from /balance.json; a reader's own balance overrides it.
  let balFixed = false;
  const balEl = document.getElementById("balance");
  if (balEl) { try { const b = JSON.parse(balEl.textContent); FB.setMaster(b.weights || b); balFixed = !!b.fixed; } catch (e) {} }
  else if (ONSITE) FB.loadMaster("/balance.json");
  document.body.classList.toggle("studio", balFixed);
  const fmtDate = d => d ? new Date(d + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) : "";

  /* ---------- the feed ---------- */
  const card = (it, i) => `<section class="item" data-i="${i}" aria-label="${esc(it.title)}">
    <div class="subject"><div class="subject-text">
      <h1>${esc(it.title)}</h1>
      <p class="lede">${esc(it.statement)}</p>
      ${it.date ? `<p class="subject-date">${fmtDate(it.date)}</p>` : ""}
      <div class="bg-slot"></div>
    </div></div></section>`;
  const bgHtml = R => {
    const BG = (R.subject && R.subject.background) || {};
    const lines = String(BG.brief || "").split(/\n+/).map(t => t.trim()).filter(Boolean);
    const src = (Array.isArray(BG.sources) ? BG.sources : []).filter(x => x && /^https?:\/\//.test(String(x.url || "")));
    return lines.length ? `<div class="subject-bg"><span class="bg-lbl">Background</span>${lines.map(t => `<p>${esc(t)}</p>`).join("")}${src.length
      ? `<div class="bg-src"><span>Sources:</span>${src.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title || x.url)}</a>`).join("")}</div>` : ""}</div>` : "";
  };
  app.innerHTML = `
    <main class="feed" id="feed" aria-label="Reflections">${items.length ? items.map(card).join("") : '<p class="feed-msg">No Reflections yet.</p>'}</main>
    <div class="reader" id="reader" hidden></div>
    <div class="dock" id="dock"><div class="dial" id="dial"></div></div>`;
  const feed = document.getElementById("feed"), reader = document.getElementById("reader"), dialEl = document.getElementById("dial");

  /* ---------- toolbar ---------- */
  const BAR = window.FramoidBar.feed({ chrome: !balFixed, onBack: () => back() });

  /* ---------- the dial (one dial; Framoid is the knob for the reader's stance and for tuning) ---------- */
  const A = window.FramoidAccount;
  let cur = -1;
  const curSlug = () => (items[cur] && !inline) ? items[cur].slug : "";
  const dial = FB.mount(dialEl, {
    knob: true,
    onGod: g => open(pairOf(g).id, g),
    onCore: () => open("field"),
    onTune: on => {
      document.body.classList.toggle("tuning", on);
      BAR.setMode(on ? "tune" : view === "subject" ? "feed" : "reader");
      if (on) window.FramoidBar.toast("Drag the gods in or out · tap Framoid when done");
    },
    stance: {
      get: () => (A && curSlug() && A.stanceOf) ? A.stanceOf(curSlug()) : null,
      set: v => { if (A && curSlug()) A.setStance(curSlug(), v); },
      allowed: () => { if (balFixed || !A || !curSlug()) return false; if (A.state().signedIn) return true; A.setStance(curSlug(), 0); return false; }
    }
  });
  dial.compact(true);
  // While tuning, taps on the page (links, Passages, chips) do nothing; scrolling and swiping still work.
  document.addEventListener("click", e => {
    if (document.body.classList.contains("tuning") && e.target.closest("#feed, #reader")) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  ["framoid:stances", "framoid:account"].forEach(n => window.addEventListener(n, () => dial.redraw()));

  /* ---------- the Reflection in view ---------- */
  function setCurrent(i) {
    if (i === cur || !items[i]) return;
    cur = i; const it = items[i];
    const st = isTallied(it.stances) ? it.stances : null;
    dial.setStances(st);
    BAR.setReflection({ slug: inline ? "" : it.slug, title: pageTitle(it) });
    if (ONSITE) {
      document.title = pageTitle(it);
      const path = `/r/${encodeURIComponent(it.slug)}/`;
      if (location.pathname !== path) { try { history.replaceState(null, "", path + location.hash); } catch (e) {} }
    }
    [i, i + 1, i - 1].forEach(j => items[j] && fillBg(j));
  }
  const pageTitle = it => it.number && it.number.toLowerCase() !== "sample" ? `Framoid Reflection ${it.number}: ${it.title}` : `Framoid Reflection: ${it.title}`;
  function fillBg(j) {
    const it = items[j]; if (it.bgDone) return; it.bgDone = true;
    full(it).then(R => { const slot = feed.querySelector(`.item[data-i="${j}"] .bg-slot`); if (slot) slot.outerHTML = bgHtml(R); }).catch(() => { it.bgDone = false; });
  }
  const indexNow = () => Math.max(0, Math.min(items.length - 1, Math.round(feed.scrollLeft / Math.max(1, feed.clientWidth))));
  let ticking = false;
  feed.addEventListener("scroll", () => { if (ticking) return; ticking = true; requestAnimationFrame(() => { ticking = false; setCurrent(indexNow()); }); }, { passive: true });
  const goTo = (i, smooth) => { i = Math.max(0, Math.min(items.length - 1, i)); feed.scrollTo({ left: i * feed.clientWidth, behavior: smooth ? "smooth" : "auto" }); setCurrent(i); };
  // Keep the same Reflection in view when the window changes size.
  window.addEventListener("resize", () => { if (cur >= 0 && reader.hidden) feed.scrollLeft = cur * feed.clientWidth; });

  // Swipes that start on the dial (outside the scrolling feed) also turn the page, unless Framoid is being held or tuned.
  const dockEl = document.getElementById("dock");
  let sw = null;
  dockEl.addEventListener("pointerdown", e => { if (!dial.tuning() && view === "subject") sw = { x: e.clientX, y: e.clientY, held: false }; });

    if (!sw) return; const s0 = sw; sw = null; if (s0.held || dial.tuning()) return;

  const stance = st => st === "embraces" ? '<span class="stance">↑ Embraces</span>' : st === "opposes" ? '<span class="stance opp">↓ Opposes</span>' : "";
  const passOut = (from, to, text) => text ? `<button type="button" class="pass" data-to="${to}" style="--a: var(--${from}); --b: var(--${to})"

      <span class="pass-top"><span class="lbl">Passage</span><span class="arrow">→</span><span style="color:var(--${to}-text)">${PANTHEON[to].name}</span></span>
      <span class="pass-text">${esc(text)}</span></button>` : "";
  const instruments = (id, r) => {

  };

          <p>${esc(ps)}</p></div>` : ""}
      </div></section>`;
  };
  const chipColors = { "Rodim · Aromi": ["rodim", "aromi"], "Ora · Mir": ["ora", "mir"], "Mir · Ora": ["mir", "ora"], "Idrom · Doria": ["idrom", "doria"] };
  const fieldView = R => {
    const f = R.field || {};
    return `<section class="view" id="view-field" aria-label="Framoid" hidden>
    <div class="field glass"><div class="sigil" aria-hidden="true"></div><div class="field-body">
      <span class="eyebrow">${PANTHEON.framoid.epithet}</span><h2>Framoid</h2>
      <p class="question">${PANTHEON.framoid.q}</p>
      <div class="field-text">${(f.paragraphs || []).map(p => `<p>${esc(p)}</p>`).join("")}</div>
      ${(f.held || []).length ? `<span class="held-title">Held open</span><div class="held">${f.held.map(h => {
        const names = String(h.pairs || "").toLowerCase(), pv = PAIRS.find(v => v.gods.every(g => names.includes(g)));
        const c = chipColors[h.pairs] || (pv ? pv.gods : []);
        const inner = `<span class="chip-top">${c.map(x => `<b style="background:var(--${x})"></b>`).join("")}${esc(h.pairs)}</span><p>${esc(h.text)}</p>`;
        return pv ? `<button type="button" class="chip" data-view="${pv.id}" aria-label="${esc(h.pairs)}: ${esc(h.text)} Open ${pv.title}.">${inner}</button>` : `<div class="chip">${inner}</div>`;
      }).join("")}</div>` : ""}
      <p class="note">Each Reading speaks as one pure force. Framoid holds them together; it does not rank them.</p>
      <p class="note">${window.FramoidBar.disclaimerLine()}</p>
    </div></div></section>`;
  };

  let view = "subject", built = -1, pushed = false;
  async function open(id, god) {
    if (!items[cur]) return;
    if (dial.tuning()) dial.tune(false);
    const it = items[cur];
    if (built !== cur) {
      let R; try { R = await full(it); } catch (e) { window.FramoidBar.toast("Couldn't load this Reflection"); return; }
      reader.innerHTML = fieldView(R) + PAIRS.map(v => pairView(R, v)).join(""); built = cur;
    }
    if (view === "subject" && location.hash.slice(1) !== id) { try { history.pushState(null, "", "#" + id); pushed = true; } catch (e) {} }
    else { try { history.replaceState(null, "", "#" + id); } catch (e) {} }
    show(id, god);
  }
  function show(id, god) {
    view = id;
    const reading = id !== "subject";
    document.body.classList.toggle("reading", reading);
    document.body.dataset.view = id;
    feed.hidden = reading; reader.hidden = !reading;
    dialEl.dataset.view = id;

    BAR.setMode(reading ? "reader" : "feed");
    if (reading) {
      READER.forEach(v => { const el = document.getElementById("view-" + v.id); if (el) { el.hidden = v.id !== id; el.classList.remove("enter"); } });
      const el = document.getElementById("view-" + id); if (el) { void el.offsetWidth; el.classList.add("enter"); }
      reader.scrollTop = 0;
      if (god) { const c = document.getElementById("card-" + god); if (c) { c.scrollIntoView({ block: "nearest", inline: "start" }); c.classList.remove("ping"); void c.offsetWidth; c.classList.add("ping"); } }
    } else requestAnimationFrame(() => { feed.scrollLeft = cur * feed.clientWidth; });
  }
  function back() {
    if (pushed) { pushed = false; history.back(); return; }
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
    show("subject");
  }
  window.addEventListener("popstate", () => {
    const id = location.hash.slice(1);
    if (READER.some(v => v.id === id)) open(id); else { pushed = false; show("subject"); }
  });

  reader.addEventListener("click", e => {
    const seg = e.target.closest(".seg button");
    if (seg) {
      const c = seg.closest(".card");
      c.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b === seg)));
      c.querySelectorAll(".ii p").forEach(p => p.setAttribute("aria-hidden", String(p.dataset.part !== seg.dataset.show)));
      return;
    }
    const pass = e.target.closest(".pass");
    if (pass) {
      const c = document.getElementById("card-" + pass.dataset.to);
      if (c) { c.scrollIntoView({ behavior: "smooth", block: window.matchMedia("(max-width: 900px)").matches ? "start" : "nearest", inline: "start" }); c.classList.remove("ping"); void c.offsetWidth; c.classList.add("ping"); }
      return;
    }
    const chip = e.target.closest("button.chip"); if (chip) open(chip.dataset.view);
  });
  document.addEventListener("keydown", e => {
    if (e.altKey || e.metaKey || e.ctrlKey || e.target.closest("input, textarea, [role=slider]")) return;
    if (view === "subject") {
      if (e.key === "ArrowRight" || e.key === "l") { e.preventDefault(); goTo(cur + 1, true); }
      if (e.key === "ArrowLeft" || e.key === "h") { e.preventDefault(); goTo(cur - 1, true); }
      return;
    }
    const k = READER.findIndex(v => v.id === view);
    if (e.key === "ArrowRight") open(READER[(k + 1) % READER.length].id);
    if (e.key === "ArrowLeft") open(READER[(k + READER.length - 1) % READER.length].id);
    if (e.key === "Escape") back();
  });

  /* ---------- start ---------- */
  const start = Math.max(0, items.findIndex(x => x.slug === pathSlug));
  document.body.dataset.view = "subject";
  BAR.setMode("feed");
  requestAnimationFrame(() => {
    goTo(start);
    const h = location.hash.slice(1);
    if (READER.some(v => v.id === h)) open(h);
  });
})();
</script>
</body>
</html>
