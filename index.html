<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Framoid</title>
<meta name="description" content="Framoid Reflections: a Subject considered by six paired gods, held together by Framoid, the Undivided Source.">
<style>
:root {
  --bg: #eceef4; --ink: #14151a; --muted: #5c606e;
  --glass: rgba(255,255,255,.5); --glass-strong: rgba(255,255,255,.78);
  --stroke: rgba(255,255,255,.7); --hairline: rgba(20,24,40,.08);
  --hl: rgba(255,255,255,.95); --shadow: rgba(30,36,70,.14); --blob: .5; --focus: #0a6cff;
  --rodim: #c4461a; --aromi: #13789a; --mir: #95661d; --ora: #5e47b8; --idrom: #4b5b6d; --doria: #2f8443;
  --text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #08090d; --ink: #f3f3f6; --muted: #9ea2b0;
    --glass: rgba(30,32,42,.46); --glass-strong: rgba(58,61,74,.7);
    --stroke: rgba(255,255,255,.13); --hairline: rgba(255,255,255,.08);
    --hl: rgba(255,255,255,.2); --shadow: rgba(0,0,0,.5); --blob: .42; --focus: #5aa2ff;
    --rodim: #ff7a45; --aromi: #4cc3e6; --mir: #e0ae5c; --ora: #a996ff; --idrom: #a6b6c8; --doria: #6fd284;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; color: var(--ink);
  font: 15px/1.5 var(--text); -webkit-font-smoothing: antialiased;
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.fields { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.fields i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(70px); opacity: var(--blob); }
.fields i:nth-child(1) { background: var(--aromi); left: -20vmax; top: -22vmax; }
.fields i:nth-child(2) { background: var(--doria); right: -24vmax; top: 10vh; opacity: calc(var(--blob) * .8); }
.fields i:nth-child(3) { background: var(--rodim); left: 10vw; bottom: -34vmax; opacity: calc(var(--blob) * .7); }
.fields i:nth-child(4) { background: var(--ora); right: 5vw; bottom: -30vmax; opacity: calc(var(--blob) * .6); }
.glass {
  background: var(--glass); border: 1px solid var(--stroke); border-radius: 26px;
  -webkit-backdrop-filter: blur(28px) saturate(1.6); backdrop-filter: blur(28px) saturate(1.6);
  box-shadow: inset 0 1px 0 var(--hl), 0 10px 34px -12px var(--shadow);
}
main { max-width: 880px; margin: 0 auto; }
header { padding: 26px 26px 22px; margin-bottom: 18px; }
h1 { font: 700 34px/1.1 var(--display); letter-spacing: -.02em; margin: 0 0 8px; }
.lede { margin: 0; color: var(--muted); max-width: 60ch; }
.gods { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; font-size: 13px; color: var(--muted); }
.gods span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--c); vertical-align: 1px; }
.list { display: grid; gap: 14px; }
a.card { display: block; padding: 20px 22px; color: inherit; text-decoration: none; transition: transform .25s ease, box-shadow .25s ease; }
a.card:hover { transform: translateY(-2px); box-shadow: inset 0 1px 0 var(--hl), 0 16px 40px -14px var(--shadow); }
a.card:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.meta { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.card h2 { font: 650 20px/1.25 var(--display); letter-spacing: -.01em; margin: 0 0 6px; }
.card p { margin: 0; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stance { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; }
.dots { display: flex; gap: 5px; }
.dots b { width: 12px; height: 12px; border-radius: 50%; background: var(--c); border: 2px solid var(--c); }
.dots b.opp { background: transparent; border-style: dashed; }
.result { font-weight: 650; }
.empty { padding: 26px; color: var(--muted); text-align: center; }
footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 26px; }
@media (max-width: 560px) { header { padding: 22px 20px 18px; } h1 { font-size: 28px; } a.card { padding: 18px; } }
@media (prefers-reduced-motion: reduce) { a.card { transition: none; } a.card:hover { transform: none; } }
</style>
</head>
<body>
<div class="fields" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<main>
  <header class="glass">
    <h1>Framoid</h1>
    <p class="lede">Reflections on one Subject at a time. Six gods, in three reciprocal pairs, each give a Reading; Framoid, the Undivided Source, holds them together without ranking or resolving them.</p>
    <div class="gods" aria-label="The gods">
      <span style="--c:var(--rodim)">Rodim</span><span style="--c:var(--aromi)">Aromi</span>
      <span style="--c:var(--mir)">Mir</span><span style="--c:var(--ora)">Ora</span>
      <span style="--c:var(--idrom)">Idrom</span><span style="--c:var(--doria)">Doria</span>
    </div>
  </header>
  <section class="list" id="list" aria-label="Reflections"><div class="glass empty">Loading Reflections…</div></section>
  <footer>framoid.com</footer>
</main>
<script>
(async () => {
  const GODS = ["rodim", "aromi", "mir", "ora", "idrom", "doria"];
  const NAME = { rodim: "Rodim", aromi: "Aromi", mir: "Mir", ora: "Ora", idrom: "Idrom", doria: "Doria" };
  const list = document.getElementById("list");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = d => { const t = Date.parse(d + "T12:00:00"); return isNaN(t) ? esc(d) : new Date(t).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }); };
  let items = [];
  try { items = (await (await fetch("reflections.json", { cache: "no-cache" })).json()).reflections || []; }
  catch (e) { list.innerHTML = '<div class="glass empty">The Reflections could not be loaded.</div>'; return; }
  if (!items.length) { list.innerHTML = '<div class="glass empty">No Reflections published yet.</div>'; return; }
  list.innerHTML = items.map(r => {
    const st = r.stances || {};
    const tallied = GODS.every(g => st[g] === "embraces" || st[g] === "opposes");
    const up = GODS.filter(g => st[g] === "embraces").length, dn = 6 - up;
    const result = up > dn ? "Embraced" : up < dn ? "Opposed" : "Tie";
    const dots = tallied ? `<div class="stance"><span class="dots">${GODS.map(g =>
      `<b class="${st[g] === "opposes" ? "opp" : ""}" style="--c:var(--${g})" title="${NAME[g]} ${st[g]}"></b>`).join("")}</span>
      <span class="result">${result}</span></div>` : "";
    const label = /^\d+$/.test(r.number) ? "Reflection " + esc(r.number) : esc(r.number);
    return `<a class="card glass" href="r/${encodeURIComponent(r.slug)}/">
      <div class="meta"><span>${label}</span><span>${fmt(r.date)}</span></div>
      <h2>${esc(r.title)}</h2><p>${esc(r.statement)}</p>${dots}</a>`;
  }).join("");
})();
</script>
</body>
</html>
