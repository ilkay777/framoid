name: Publish and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish the inbox and rebuild every page from the template
        run: |
          if ls inbox/*.json >/dev/null 2>&1; then python3 tools/publish.py inbox; fi
          python3 tools/publish.py rebuild
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "framoid-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Publish inbox / rebuild pages from template"
            git push
          else
            echo "Nothing to commit"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
