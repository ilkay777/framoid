<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Framoid Studio</title>
<style>
:root {
  --bg: #eceef4; --ink: #14151a; --muted: #5c606e;
  --glass: rgba(255,255,255,.55); --glass-strong: rgba(255,255,255,.82); --seg: rgba(20,24,40,.06);
  --stroke: rgba(255,255,255,.7); --hairline: rgba(20,24,40,.09);
  --hl: rgba(255,255,255,.95); --shadow: rgba(30,36,70,.14); --blob: .45; --focus: #0a6cff; --danger: #c22f2f;
  --rodim: #c4461a; --aromi: #13789a; --mir: #95661d; --ora: #5e47b8; --idrom: #4b5b6d; --doria: #2f8443;
  --text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #08090d; --ink: #f3f3f6; --muted: #9ea2b0;
    --glass: rgba(30,32,42,.5); --glass-strong: rgba(58,61,74,.75); --seg: rgba(255,255,255,.07);
    --stroke: rgba(255,255,255,.13); --hairline: rgba(255,255,255,.09);
    --hl: rgba(255,255,255,.2); --shadow: rgba(0,0,0,.5); --blob: .38; --focus: #5aa2ff; --danger: #ff6b6b;
    --rodim: #ff7a45; --aromi: #4cc3e6; --mir: #e0ae5c; --ora: #a996ff; --idrom: #a6b6c8; --doria: #6fd284;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); height: 100%; }
body {
  margin: 0; height: 100%; color: var(--ink); font: 15px/1.5 var(--text); -webkit-font-smoothing: antialiased;
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  display: flex; flex-direction: column;
}
.fields { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.fields i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(70px); opacity: var(--blob); }
.fields i:nth-child(1) { background: var(--ora); left: -22vmax; top: -24vmax; }
.fields i:nth-child(2) { background: var(--aromi); right: -24vmax; top: 6vh; opacity: calc(var(--blob) * .8); }
.fields i:nth-child(3) { background: var(--rodim); left: 12vw; bottom: -36vmax; opacity: calc(var(--blob) * .6); }
.glass {
  background: var(--glass); border: 1px solid var(--stroke); border-radius: 22px;
  -webkit-backdrop-filter: blur(28px) saturate(1.6); backdrop-filter: blur(28px) saturate(1.6);
  box-shadow: inset 0 1px 0 var(--hl), 0 10px 34px -14px var(--shadow);
}
button, .btn {
  font: 600 14px/1 var(--text); color: var(--ink); background: var(--glass-strong); border: 1px solid var(--stroke);
  border-radius: 999px; padding: 10px 16px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  box-shadow: inset 0 1px 0 var(--hl);
}
button:hover, .btn:hover { filter: brightness(1.04); }
button:focus-visible, .btn:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; }
button.primary, .btn.primary { background: var(--ink); color: var(--bg); border-color: transparent; }
button.danger { color: var(--danger); }
button.ghost { background: transparent; box-shadow: none; border-color: transparent; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* top bar: in a session it is a slim strip flush with the top, so the Reflection gets the room */
body.work { padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
body.work .bar { margin: 0; border-radius: 0; border-width: 0 0 1px; padding: max(4px, env(safe-area-inset-top)) 8px 4px; gap: 6px; min-height: 40px; }
body.work .bar h1 { font-size: 14px; font-weight: 650; }
body.work .bar button { padding: 6px 12px; font-size: 13px; }
body.work .viewer { border-radius: 0; border: 0; box-shadow: none; background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
body.work .chat { border-radius: 0; border-width: 0; margin-top: 0; }
@media (max-width: 640px) { body.work .bar { flex-wrap: nowrap; } body.work .bar h1 { flex-basis: auto; } body.work .bar .actions { width: auto; flex-wrap: nowrap; overflow-x: auto; } }

.bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 12px; flex: none; }
.bar h1 { font: 700 18px/1.2 var(--display); margin: 0; letter-spacing: -.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* home */
.home { overflow: auto; width: 100%; max-width: 860px; margin: 0 auto; }
.intro { padding: 22px 24px; margin-bottom: 14px; }
.intro h2 { font: 700 28px/1.15 var(--display); margin: 0 0 6px; letter-spacing: -.02em; }
.intro p { margin: 0 0 14px; color: var(--muted); max-width: 62ch; }
.list { display: grid; gap: 10px; padding-bottom: 8px; }
.item { line-height: 1.4; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 16px 18px; cursor: pointer; text-align: left; border-radius: 20px; width: 100%; font-weight: 400; }
.item .t { font: 650 17px/1.3 var(--display); }
.item .s { grid-column: 1 / -1; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .m { font-size: 12.5px; color: var(--muted); }
.chip { font: 600 11.5px/1 var(--text); letter-spacing: .03em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px; background: var(--seg); color: var(--muted); align-self: start; white-space: nowrap; }
.chip.written { color: var(--ora); }
.chip.sent { color: var(--doria); }
.chip.ready { color: var(--aromi); }
.empty { padding: 22px; text-align: center; color: var(--muted); }

/* chat */
.chat { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 860px; margin: 0 auto; overflow: hidden; }
.log { flex: 1; min-height: 0; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 86%; padding: 12px 15px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; }
.msg.me { align-self: flex-end; background: var(--ink); color: var(--bg); border-bottom-right-radius: 6px; }
.msg.ai { align-self: flex-start; background: var(--glass-strong); border: 1px solid var(--stroke); border-bottom-left-radius: 6px; white-space: normal; }
.msg.ai p { margin: 0 0 8px; } .msg.ai p:last-child { margin-bottom: 0; }
.q { margin-top: 10px; } .q b { display: block; font-weight: 600; margin-bottom: 6px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts button { font-weight: 500; font-size: 13.5px; padding: 8px 12px; background: var(--seg); box-shadow: none; border-color: transparent; text-align: left; line-height: 1.3; }
.opts button.on { background: var(--ink); color: var(--bg); }
.proposal { margin-top: 12px; padding: 14px; border-radius: 16px; background: var(--seg); }
.proposal .eyebrow { font: 700 11px/1 var(--text); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.proposal h3 { font: 650 17px/1.3 var(--display); margin: 0 0 6px; }
.proposal p { margin: 0 0 12px; }
.proposal .row { display: flex; gap: 8px; flex-wrap: wrap; }
.bgcard { align-self: stretch; padding: 12px 15px; border-radius: 16px; background: var(--seg); font-size: 14px; }
.bgcard summary { cursor: pointer; font-weight: 650; }
.bgcard p { margin: 8px 0 0; } .bgcard a { color: inherit; }
.status { align-self: flex-start; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 10px; }
.status.err { color: var(--danger); }
.dots i { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
.composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--hairline); align-items: flex-end; }
textarea { flex: 1; resize: none; font: 15px/1.45 var(--text); color: var(--ink); background: var(--glass-strong); border: 1px solid var(--stroke); border-radius: 16px; padding: 10px 14px; min-height: 44px; max-height: 160px; }

/* reflection viewer */
.viewer { flex: 1; min-height: 0; border-radius: 22px; overflow: hidden; }
.viewer iframe { width: 100%; height: 100%; border: 0; display: block; background: transparent; }

/* sheet (dialogs) */
.scrim { position: fixed; inset: 0; background: rgba(10,12,20,.35); display: grid; place-items: center; padding: 16px; z-index: 10; }
.sheet { width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 22px; background: var(--glass-strong); }
.sheet h2 { font: 700 20px/1.2 var(--display); margin: 0 0 8px; }
.sheet ol { padding-left: 20px; margin: 12px 0; } .sheet li { margin-bottom: 12px; }
.sheet .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 16px; }
.sheet textarea { width: 100%; min-height: 110px; max-height: 260px; }
.note { font-size: 13px; color: var(--muted); margin-top: 6px; }

@media (max-width: 640px) {
  .bar { flex-wrap: wrap; }
  .bar h1 { flex-basis: calc(100% - 60px); }
  .bar .actions { width: 100%; justify-content: flex-start; }
  .bar .actions button { padding: 9px 13px; }
  .msg { max-width: 94%; }
  .intro h2 { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .6; } }
</style>
</head>
<body>
<div class="fields" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="bar glass" hidden>
  <button class="ghost" id="back" hidden aria-label="Back to the Studio">‹ Studio</button>
  <h1 id="heading">Framoid Studio</h1>
  <div class="actions" id="actions"></div>
</header>

<main>
  <section class="view home" id="v-home">
    <div class="intro glass">
      <h2>Framoid Studio</h2>
      <p>Each session starts fresh: shape a Subject, let the six gods give their Readings and Framoid hold them in The Field. Nothing carries over between sessions. Drafts stay here, visible only to you, until you publish one to framoid.com.</p>
      <button class="primary" id="new">New Reflection</button>
      <p class="note" id="unavailable" hidden></p>
    </div>
    <div class="list" id="list"><div class="glass empty">Loading…</div></div>
  </section>

  <section class="view" id="v-chat" hidden>
    <div class="chat glass">
      <div class="log" id="log" aria-live="polite"></div>
      <form class="composer" id="composer">
        <textarea id="box" rows="1" placeholder="A topic, a question, or “Subject: …”" aria-label="Message"></textarea>
        <button class="primary" id="send" type="submit">Send</button>
        <button id="stop" type="button" hidden>Stop</button>
      </form>
    </div>
  </section>

  <section class="view" id="v-read" hidden>
    <div class="viewer glass"><iframe id="frame" title="Reflection"></iframe></div>
  </section>
</main>

<div class="scrim" id="scrim" hidden><div class="sheet glass" id="sheet" role="dialog" aria-modal="true"></div></div>

<script id="studio-files" type="application/json">{}</script>
<script>
(() => {
  "use strict";
  const REPO_NEW = "https://github.com/ilkay777/framoid/new/main/inbox";
  const SITE = "https://framoid.com";
  const FIRST_NUMBER = 6; // Reflections 1-5 were made before the Studio
  const GODS = ["rodim", "aromi", "mir", "ora", "idrom", "doria"];
  const PAIRS = { decision_adaptation: ["rodim", "aromi"], mind_matter: ["mir", "ora"], structure_harmony: ["idrom", "doria"] };
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  let db = null, sample = null, files = {}, items = [], cur = null, ctl = null, busy = false, unsub = null;

  /* ---------- copy for errors ---------- */
  const errText = e => ({
    not_granted: "Claude isn't allowed for this page. Allow it when asked, or reload to be asked again.",
    sampling_disabled: "Claude isn't available for this account here.",
    rate_limited: "You've hit a usage limit for now. Try again a little later.",
    session_expired: "Your claude.ai session expired. Sign in again, then retry.",
    refused: "Claude declined this one. Try rephrasing.",
    invalid_json: "The answer came back in the wrong shape. Try again.",
    empty_completion: "No answer came back. Try again.",
    prompt_too_large: "This session got too long. Start a new Reflection.",
    cancelled: "Stopped.",
  }[e && e.code] || (e && e.message && !e.code ? e.message : "Something went wrong. Try again."));

  /* ---------- prompts ---------- */
  // Background researched in a project session ("Subject scout"); facts for accuracy, not anyone's opinion.
  const background = () => (cur && cur.context && cur.context.brief) ? `

## Background on the Subject (researched; use it for accuracy, it is not anyone's opinion)
${cur.context.brief}` : "";

  const shapePrompt = () => files.rules + background() + `

## Your task now: shape the Subject (do not write the Reflection yet)
You are helping the user decide exactly what this Reflection will consider. Reply with ONLY one JSON object:
{"say": string, "questions": [{"q": string, "options": [string, ...]}], "proposal": null | {"title": string, "statement": string}}
- If the user's message is an explicit Subject (for example it starts with "Subject:"), go straight to a proposal built from it, unless it is genuinely ambiguous.
- Otherwise ask one to three questions per turn, each with two to four short, concrete options. The user can always answer in their own words, so do not add an "other" option.
- Useful angles: which situation, decision, event or question within the topic; whose perspective or what scale (personal, community, society); a specific moment versus an ongoing process; what is at stake or changing.
- Build on each answer, narrowing step by step; never repeat settled points.
- When the Subject is clear, give a proposal: a one-line title plus a two-or-three-sentence plain statement, and in "say" ask the user to confirm or adjust it. Leave "questions" empty when you give a proposal.
- "say" is one to three short, plain sentences. Write in the user's language.`;

  const writePrompt = (subj) => files.rules + background() + `

## Your task now: write the Reflection
Confirmed Subject:
Title: ${subj.title}
Statement: ${subj.statement}

Reply with ONLY one JSON object in exactly the shape of the example below. The example is a different Subject: copy its structure, keys and lengths, never its content.
- "subject": the confirmed title and statement above, unchanged.
- "pairs": decision_adaptation {rodim, aromi, passage {rodim, aromi}}, mind_matter {mir, ora, passage {mir, ora}}, structure_harmony {idrom, doria, passage {idrom, doria}}.
- Each Reading: {"stance": "embraces" | "opposes", "answer": string, "instruments": [one or two], "claimed": [at most one, only for a claimed Instrument; otherwise omit], "impulse": string, "imprint": string}.
- passage.<god> is the Passage starting from that god and leading to its partner.
- "field": {"paragraphs": [three short paragraphs], "held": [three items {"pairs": "Rodim · Aromi" | "Mir · Ora" | "Idrom · Doria", "text": one open question each]}.

Example:
${files.shape}`;

  const revisePrompt = (refl, instruction) => files.rules + background() + `

## Your task now: revise this Reflection
Current Reflection (JSON):
${JSON.stringify(stripMeta(refl))}

The user's instruction: ${instruction}

Apply the instruction and follow every rule above. Change only what the instruction asks for; keep everything else word for word. Reply with ONLY the whole revised Reflection as one JSON object in the same shape.`;

  // The background is the Studio's to attach, not Claude's to write: strip it before sending a Reflection to Claude.
  const stripMeta = r => { const { number, date, schema, ...rest } = r || {};
    if (rest.subject && rest.subject.background) { const { background, ...s } = rest.subject; rest.subject = s; } return rest; };
  // Scout background (session context) as stored in a Reflection: subject.background (schema 5).
  const bgOf = it => (it && it.context && it.context.brief) ? { brief: String(it.context.brief),
    sources: (it.context.sources || []).filter(x => x && /^https?:\/\//.test(x.url)).map(x => ({ title: String(x.title || x.url), url: String(x.url) })),
    preparedAt: String(it.context.preparedAt || "").slice(0, 10) } : null;
  // Older Reflections from scout sessions lack the field: add it, so the view and the published page show it.
  function withBackground(it) {
    const r = it.reflection, bg = bgOf(it);
    if (!r || !r.subject || !bg || r.subject.background) return r;
    return { ...r, schema: Math.max(5, r.schema || 0), subject: { ...r.subject, background: bg } };
  }

  /* ---------- validation ---------- */
  function problems(r) {
    const p = [];
    if (!r || typeof r !== "object") return ["not an object"];
    if (!r.subject || !r.subject.title || !r.subject.statement) p.push("subject");
    for (const [key, gods] of Object.entries(PAIRS)) {
      const pair = (r.pairs || {})[key];
      if (!pair) { p.push(key); continue; }
      for (const g of gods) {
        const rd = pair[g];
        if (!rd || !["embraces", "opposes"].includes(rd.stance) || !rd.answer || !rd.impulse || !rd.imprint || !Array.isArray(rd.instruments) || !rd.instruments.length) p.push(g);
        if (!pair.passage || typeof pair.passage !== "object" || !pair.passage[g]) p.push(g + " passage");
      }
    }
    if (!r.field || !Array.isArray(r.field.paragraphs) || r.field.paragraphs.length < 1) p.push("field");
    return p;
  }
  function normalise(r) {
    for (const [key, gods] of Object.entries(PAIRS)) for (const g of gods) {
      const rd = r.pairs[key][g];
      if (!Array.isArray(rd.claimed) || !rd.claimed.length) delete rd.claimed;
    }
    if (!Array.isArray(r.field.held)) r.field.held = [];
    return r;
  }

  /* ---------- storage ---------- */
  const col = () => db.collection("reflections");
  const now = () => new Date().toISOString();
  async function save(it) {
    it.updatedAt = now();
    const body = JSON.parse(JSON.stringify(it));
    await col().doc(it.id).set(body);
  }
  function nextNumber() {
    const nums = items.map(i => parseInt(i.number, 10)).filter(n => !isNaN(n));
    return String(Math.max(FIRST_NUMBER - 1, ...nums) + 1);
  }

  /* ---------- views ---------- */
  function show(view) {
    for (const v of ["home", "chat", "read"]) $("v-" + v).hidden = v !== view;
    $("back").hidden = view === "home";
    document.querySelector(".bar").hidden = view === "home"; // the home intro already names the Studio
    document.body.classList.toggle("work", view !== "home");
    if (view === "home") { $("heading").textContent = "Framoid Studio"; $("actions").innerHTML = ""; cur = null; }
  }

  function statusChip(it) {
    if (it.status === "sent") return '<span class="chip sent">On framoid.com</span>';
    if (it.status === "written") return '<span class="chip written">Written</span>';
    if (it.proposal) return '<span class="chip ready">Ready to write</span>';
    return '<span class="chip">Shaping</span>';
  }
  function renderList() {
    const list = $("list");
    if (!items.length) { list.innerHTML = '<div class="glass empty">No Reflections yet. Start one above.</div>'; return; }
    list.innerHTML = items.map(it => {
      const s = (it.reflection && it.reflection.subject) || it.proposal || {};
      const title = s.title || it.firstMessage || "New session";
      const label = it.number ? "Reflection " + esc(it.number) : "Draft";
      const when = new Date(it.updatedAt || it.createdAt).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
      return `<button class="item glass" data-id="${esc(it.id)}">
        <span class="t">${esc(title)}</span>${statusChip(it)}
        ${s.statement ? `<span class="s">${esc(s.statement)}</span>` : ""}
        <span class="m">${label} · ${esc(when)}</span></button>`;
    }).join("");
  }
  $("list").addEventListener("click", e => {
    const b = e.target.closest(".item"); if (!b) return;
    const it = items.find(i => i.id === b.dataset.id); if (it) open(it);
  });

  function open(it) {
    cur = JSON.parse(JSON.stringify(it)); // snapshots are frozen; work on a copy
    if (it.reflection) openReading(); else openChat();
  }

  /* ---------- chat ---------- */
  function openChat() {
    show("chat");
    $("heading").textContent = cur.number ? "Reflection " + cur.number : "New Reflection";
    $("actions").innerHTML = cur.reflection ? "" : '<button class="danger ghost" id="del">Delete</button>';
    const del = $("del"); if (del) del.onclick = confirmDelete;
    renderLog();
    $("box").focus();
  }

  function aiBubble(raw, i, last) {
    let m; try { m = JSON.parse(raw); } catch { m = { say: raw }; }
    const say = (m.say || "").split(/\n+/).filter(Boolean).map(t => `<p>${esc(t)}</p>`).join("");
    const qs = (last && Array.isArray(m.questions) ? m.questions : []).map((q, qi) =>
      `<div class="q"><b>${esc(q.q)}</b><div class="opts">${(q.options || []).map(o =>
        `<button type="button" data-q="${qi}" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>`).join("");
    const pastQs = (!last && Array.isArray(m.questions) && m.questions.length) ? m.questions.map(q => `<p class="muted small">${esc(q.q)}</p>`).join("") : "";
    let prop = "";
    if (m.proposal && m.proposal.title) {
      prop = `<div class="proposal"><div class="eyebrow">Proposed Subject</div><h3>${esc(m.proposal.title)}</h3><p>${esc(m.proposal.statement)}</p>` +
        (last ? `<div class="row"><button class="primary" type="button" data-act="write">Write this Reflection</button><button type="button" data-act="adjust">Adjust</button></div>` : "") + `</div>`;
    }
    return `<div class="msg ai" data-i="${i}">${say}${pastQs}${qs}${prop}</div>`;
  }

  function renderLog(status) {
    const turns = cur.turns || [];
    let html = "";
    if (cur.context && cur.context.brief) {
      const src = (cur.context.sources || []).filter(x => x && /^https?:\/\//.test(x.url));
      html += `<details class="bgcard"><summary>Background${cur.context.preparedAt ? " · prepared " + esc(String(cur.context.preparedAt).slice(0, 10)) : ""}</summary>
        ${String(cur.context.brief).split(/\n+/).filter(Boolean).map(t => `<p>${esc(t)}</p>`).join("")}
        ${src.length ? `<p class="small muted">Sources: ${src.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title || x.url)}</a>`).join(" · ")}</p>` : ""}</details>`;
    }
    if (!turns.length) html += `<div class="msg ai"><p>What should this Reflection consider? Give me a topic or a rough idea and we'll shape the Subject together, or write “Subject: …” if you already know it.</p></div>`;
    turns.forEach((t, i) => {
      const last = i === turns.length - 1 && !status;
      html += t.role === "user" ? `<div class="msg me">${esc(t.content)}</div>` : aiBubble(t.content, i, last);
    });
    if (status) html += status;
    $("log").innerHTML = html;
    $("log").scrollTop = $("log").scrollHeight;
  }
  const thinking = label => `<div class="status"><span class="dots"><i></i><i></i><i></i></span>${esc(label)}</div>`;
  const failed = msg => `<div class="status err">${esc(msg)}</div>`;

  // option chips: pick one per question; picked answers are composed into the box
  const picks = {};
  $("log").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || busy) return;
    if (b.dataset.act === "write") return writeReflection();
    if (b.dataset.act === "adjust") { $("box").focus(); return; }
    if (b.dataset.q != null) {
      const q = b.dataset.q;
      b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b && !(picks[q] === b.dataset.o)));
      picks[q] = picks[q] === b.dataset.o ? undefined : b.dataset.o;
      const lines = Object.keys(picks).sort().map(k => picks[k]).filter(Boolean);
      $("box").value = lines.join("\n");
      autosize();
    }
  });

  function autosize() { const t = $("box"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; }
  $("box").addEventListener("input", autosize);
  $("box").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); } });

  function setBusy(on) {
    busy = on; $("send").hidden = on; $("stop").hidden = !on; $("box").disabled = on;
    document.querySelectorAll("#actions button").forEach(b => b.disabled = on);
  }
  $("stop").onclick = () => ctl && ctl.abort();

  $("composer").addEventListener("submit", async e => {
    e.preventDefault();
    const text = $("box").value.trim(); if (!text || busy || !cur) return;
    for (const k in picks) delete picks[k];
    $("box").value = ""; autosize();
    cur.turns = cur.turns || [];
    cur.turns.push({ role: "user", content: text });
    if (!cur.firstMessage) cur.firstMessage = text.slice(0, 120);
    renderLog(thinking("Thinking"));
    setBusy(true);
    ctl = new AbortController();
    try {
      const input = [{ role: "user", content: shapePrompt() }, ...cur.turns.slice(-24)];
      const m = await sample.json(input, { cache: false, signal: ctl.signal });
      const reply = { say: String(m.say || ""), questions: Array.isArray(m.questions) ? m.questions.slice(0, 3) : [], proposal: m.proposal && m.proposal.title ? { title: String(m.proposal.title), statement: String(m.proposal.statement || "") } : null };
      cur.turns.push({ role: "assistant", content: JSON.stringify(reply) });
      if (reply.proposal) cur.proposal = reply.proposal;
      await save(cur);
      renderLog();
    } catch (err) {
      cur.turns.pop();
      $("box").value = text; autosize();
      renderLog(err && err.code === "cancelled" ? "" : failed(errText(err)));
    } finally { setBusy(false); $("box").focus(); }
  });

  async function writeReflection() {
    if (!cur.proposal || busy) return;
    renderLog(thinking("Writing the six Readings and The Field. This usually takes one to three minutes"));
    setBusy(true);
    ctl = new AbortController();
    try {
      let r = await sample.json(writePrompt(cur.proposal), { modelTier: "complex", cache: false, signal: ctl.signal });
      if (r && r.reflection) r = r.reflection;
      const bad = problems(r);
      if (bad.length) throw { message: "The Reflection came back incomplete (" + bad.slice(0, 4).join(", ") + "). Try again." };
      r.subject = { title: cur.proposal.title, statement: cur.proposal.statement };
      const bg = bgOf(cur); if (bg) r.subject.background = bg;
      cur.number = cur.number || nextNumber();
      cur.reflection = { schema: 5, number: cur.number, date: new Date().toISOString().slice(0, 10), ...normalise(r) };
      cur.status = "written";
      await save(cur);
      openReading();
    } catch (err) {
      renderLog(err && err.code === "cancelled" ? "" : failed(errText(err)));
    } finally { setBusy(false); }
  }

  /* ---------- reading ---------- */
  function openReading() {
    cur.reflection = withBackground(cur);
    show("read");
    $("heading").textContent = ""; // the Reflection shows its own title
    $("actions").innerHTML = `<button id="a-revise">Revise</button><button class="primary" id="a-pub">${cur.status === "sent" ? "Publish again" : "Publish"}</button><button class="ghost" id="a-chat">Chat</button><button class="danger ghost" id="a-del">Delete</button>`;
    $("a-revise").onclick = reviseSheet; $("a-pub").onclick = publishSheet; $("a-chat").onclick = openChat; $("a-del").onclick = confirmDelete;
    const json = JSON.stringify(cur.reflection).replace(/</g, "\\u003c");
    const block = `<script id="reflection" type="application/json">${json}<\/script>`;
    const title = esc("Framoid Reflection " + cur.number + ": " + cur.reflection.subject.title);
    $("frame").srcdoc = files.template.replace("<title>Framoid Reflection</title>", "<title>" + title + "</title>").replace("<body>", "<body>" + block);
  }

  /* ---------- sheets ---------- */
  function sheet(html) { $("sheet").innerHTML = html; $("scrim").hidden = false; const f = $("sheet").querySelector("textarea, button"); if (f) f.focus(); }
  function closeSheet() { $("scrim").hidden = true; $("sheet").innerHTML = ""; }
  $("scrim").addEventListener("click", e => { if (e.target === $("scrim") && !busy) closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("scrim").hidden && !busy) closeSheet(); });

  function reviseSheet() {
    sheet(`<h2>Revise</h2><p class="muted small">Say what to change. Everything else stays word for word.</p>
      <textarea id="rev" placeholder="e.g. Make Doria's Reading warmer, or give Mir a sharper Imprint"></textarea>
      <div id="rev-status" class="note"></div>
      <div class="row"><button id="rev-cancel">Cancel</button><button id="rev-stop" hidden>Stop</button><button class="primary" id="rev-go">Revise</button></div>`);
    $("rev-cancel").onclick = closeSheet;
    $("rev-stop").onclick = () => ctl && ctl.abort();
    $("rev-go").onclick = async () => {
      const ins = $("rev").value.trim(); if (!ins) return;
      busy = true; $("rev-go").disabled = true; $("rev-cancel").hidden = true; $("rev-stop").hidden = false; $("rev").disabled = true;
      $("rev-status").innerHTML = thinking("Revising. This can take a minute or two");
      ctl = new AbortController();
      try {
        let r = await sample.json(revisePrompt(cur.reflection, ins), { modelTier: "complex", cache: false, signal: ctl.signal });
        if (r && r.reflection) r = r.reflection;
        const bad = problems(r);
        if (bad.length) throw { message: "The revision came back incomplete (" + bad.slice(0, 4).join(", ") + "). Try again." };
        const { schema, number, date } = cur.reflection;
        const keepBg = cur.reflection.subject && cur.reflection.subject.background;
        if (keepBg && r.subject) r.subject.background = keepBg;
        cur.reflection = { schema, number, date, ...normalise(r) };
        cur.revisions = (cur.revisions || []).concat([{ at: now(), instruction: ins }]).slice(-20);
        if (cur.status === "sent") cur.status = "written";
        await save(cur);
        busy = false; closeSheet(); openReading();
      } catch (err) {
        busy = false;
        $("rev-status").innerHTML = err && err.code === "cancelled" ? "Stopped." : `<span style="color:var(--danger)">${esc(errText(err))}</span>`;
        $("rev-go").disabled = false; $("rev-cancel").hidden = false; $("rev-stop").hidden = true; $("rev").disabled = false;
      }
    };
  }

  function publishSheet() {
    const slug = String(cur.number).toLowerCase();
    const json = JSON.stringify(cur.reflection, null, 1);
    const link = `${REPO_NEW}?filename=reflection-${encodeURIComponent(slug)}.json`;
    sheet(`<h2>Publish to framoid.com</h2>
      <p class="muted small">No AI is used for this step. GitHub publishes the file for free.</p>
      <ol>
        <li><button class="primary" id="p-copy">Copy Reflection</button> <span id="p-copied" class="note"></span>
          <textarea id="p-json" readonly hidden aria-label="Reflection JSON"></textarea></li>
        <li><a class="btn" href="${esc(link)}" target="_blank" rel="noopener">Open GitHub inbox ↗</a>
          <div class="note">Opens a new file named reflection-${esc(slug)}.json in your site's inbox.</div></li>
        <li>Paste into the file and press <b>Commit changes</b>.
          <div class="note">The page goes live at ${esc(SITE)}/r/${esc(slug)}/ about two minutes later.${cur.status === "sent" ? " Publishing again replaces the page." : ""}</div></li>
      </ol>
      <div class="row"><button id="p-close">Close</button><button class="primary" id="p-done">I've committed it</button></div>`);
    $("p-json").value = json;
    $("p-copy").onclick = async () => {
      try { await navigator.clipboard.writeText(json); $("p-copied").textContent = "Copied."; }
      catch { $("p-json").hidden = false; $("p-json").select(); $("p-copied").textContent = "Copy the text below (select all, copy)."; }
    };
    $("p-close").onclick = closeSheet;
    $("p-done").onclick = async () => {
      cur.status = "sent"; cur.sentAt = now();
      try { await save(cur); } catch {}
      closeSheet(); openReading();
    };
  }

  function confirmDelete() {
    sheet(`<h2>Delete this ${cur.reflection ? "Reflection" : "session"}?</h2>
      <p class="muted small">It is removed from the Studio. ${cur.status === "sent" ? "The copy on framoid.com stays until it is taken down there." : ""}</p>
      <div class="row"><button id="d-no">Cancel</button><button class="danger" id="d-yes">Delete</button></div>`);
    $("d-no").onclick = closeSheet;
    $("d-yes").onclick = async () => {
      try { await col().doc(cur.id).delete(); } catch (e) { $("sheet").querySelector(".small").textContent = "Couldn't delete. Try again."; return; }
      closeSheet(); show("home");
    };
  }

  $("back").onclick = () => { if (busy) return; show("home"); };

  $("new").onclick = async () => {
    if (!db || !sample) return;
    cur = { id: "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), status: "shaping", createdAt: now(), turns: [] };
    openChat();
  };

  /* ---------- start ---------- */
  async function loadFiles() {
    // Everything is built into this page (see build.py), so nothing depends on how the page is served.
    const el = document.getElementById("studio-files");
    if (!el) throw new Error("files missing");
    const f = JSON.parse(el.textContent);
    files.rules = f.rules; files.shape = f.shape; files.template = f.template; files.legacy = f.legacy || [];
  }

  // One-time import of Reflections made before the Studio (built in by build.py from legacy.json).
  let importing = false;
  async function importLegacy() {
    if (importing || !files.legacy.length) return;
    importing = true;
    for (const r of files.legacy) {
      const id = "legacy-" + r.number;
      if (items.some(i => i.id === id || i.number === String(r.number))) continue;
      const at = (r.date || "2026-11-01") + "T12:00:00.000Z";
      try {
        await col().doc(id).set({ id, status: "written", number: String(r.number), createdAt: at, updatedAt: at, turns: [],
          proposal: { title: r.subject.title, statement: r.subject.statement }, reflection: r, importedFrom: "artifact" });
      } catch (e) { break; }
    }
  }

  async function start() {
    const fail = msg => { $("unavailable").hidden = false; $("unavailable").textContent = msg; $("new").disabled = true; };
    try { await loadFiles(); } catch { fail("The Studio's files could not be loaded. Reload the page."); $("list").innerHTML = ""; return; }
    if (!window.claude || !claude.use) { fail("Open the Studio on claude.ai to use it."); $("list").innerHTML = ""; return; }
    [db, sample] = await Promise.all([claude.use("db"), claude.use("sample")]);
    if (!sample) fail("Claude isn't available in this view, so new Reflections can't be written here.");
    if (!db) { fail("Sign in to claude.ai to keep and see your Reflections."); $("list").innerHTML = ""; return; }
    const timer = setTimeout(() => { if (!items.length) $("list").innerHTML = '<div class="glass empty">Your Reflections can\'t be reached yet.</div>'; }, 10000);
    unsub = col().orderBy("updatedAt", "desc").onSnapshot(snap => {
      if (!snap.metadata.fromCache) clearTimeout(timer);
      items = snap.docs.map(d => d.data()).filter(Boolean);
      renderList();
      if (!snap.metadata.fromCache) importLegacy();
    }, () => { clearTimeout(timer); $("list").innerHTML = '<div class="glass empty">Your Reflections can\'t be loaded right now.</div>'; });
  }
  start();
})();
</script>
</body>
</html>
