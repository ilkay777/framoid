<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Framoid Studio</title>
<style>
:root {
  --bg: #eceef4; --ink: #14151a; --muted: #5c606e;
  --glass: rgba(255,255,255,.55); --glass-strong: rgba(255,255,255,.82); --seg: rgba(20,24,40,.06);
  --stroke: rgba(255,255,255,.7); --hairline: rgba(20,24,40,.09);
  --hl: rgba(255,255,255,.95); --shadow: rgba(30,36,70,.14); --blob: .45; --focus: #0a6cff; --danger: #c22f2f;
  --rodim: #c4461a; --aromi: #13789a; --mir: #95661d; --ora: #5e47b8; --idrom: #4b5b6d; --doria: #2f8443;
  --text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #08090d; --ink: #f3f3f6; --muted: #9ea2b0;
    --glass: rgba(30,32,42,.5); --glass-strong: rgba(58,61,74,.75); --seg: rgba(255,255,255,.07);
    --stroke: rgba(255,255,255,.13); --hairline: rgba(255,255,255,.09);
    --hl: rgba(255,255,255,.2); --shadow: rgba(0,0,0,.5); --blob: .38; --focus: #5aa2ff; --danger: #ff6b6b;
    --rodim: #ff7a45; --aromi: #4cc3e6; --mir: #e0ae5c; --ora: #a996ff; --idrom: #a6b6c8; --doria: #6fd284;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); height: 100%; }
body {
  margin: 0; height: 100%; color: var(--ink); font: 15px/1.5 var(--text); -webkit-font-smoothing: antialiased;
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  display: flex; flex-direction: column;
}
.fields { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.fields i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(70px); opacity: var(--blob); }
.fields i:nth-child(1) { background: var(--ora); left: -22vmax; top: -24vmax; }
.fields i:nth-child(2) { background: var(--aromi); right: -24vmax; top: 6vh; opacity: calc(var(--blob) * .8); }
.fields i:nth-child(3) { background: var(--rodim); left: 12vw; bottom: -36vmax; opacity: calc(var(--blob) * .6); }
.glass {
  background: var(--glass); border: 1px solid var(--stroke); border-radius: 22px;
  -webkit-backdrop-filter: blur(28px) saturate(1.6); backdrop-filter: blur(28px) saturate(1.6);
  box-shadow: inset 0 1px 0 var(--hl), 0 10px 34px -14px var(--shadow);
}
button, .btn {
  font: 600 14px/1 var(--text); color: var(--ink); background: var(--glass-strong); border: 1px solid var(--stroke);
  border-radius: 999px; padding: 10px 16px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  box-shadow: inset 0 1px 0 var(--hl);
}
button:hover, .btn:hover { filter: brightness(1.04); }
button:focus-visible, .btn:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; }
button.primary, .btn.primary { background: var(--ink); color: var(--bg); border-color: transparent; }
button.danger { color: var(--danger); }
button.ghost { background: transparent; box-shadow: none; border-color: transparent; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* top bar: in a session it is a slim strip flush with the top, so the Reflection gets the room */
body.work { padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
body.work .bar { margin: 0; border-radius: 0; border-width: 0 0 1px; padding: max(4px, env(safe-area-inset-top)) 8px 4px; gap: 6px; min-height: 40px; }
body.work .bar h1 { font-size: 14px; font-weight: 650; }
body.work .bar button { padding: 6px 12px; font-size: 13px; }
body.work .viewer { border-radius: 0; border: 0; box-shadow: none; background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
body.work .chat { border-radius: 0; border-width: 0; margin-top: 0; }
@media (max-width: 640px) { body.work .bar { flex-wrap: nowrap; } body.work .bar h1 { flex-basis: auto; } body.work .bar .actions { width: auto; flex-wrap: nowrap; overflow-x: auto; } }

.bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 12px; flex: none; }
.bar h1 { font: 700 18px/1.2 var(--display); margin: 0; letter-spacing: -.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* home */
.home { overflow: auto; width: 100%; max-width: 860px; margin: 0 auto; }
.intro { padding: 18px 24px; margin-bottom: 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; }
.intro h2 { font: 700 28px/1.15 var(--display); margin: 0; letter-spacing: -.02em; }
.intro .note { flex-basis: 100%; margin: 0; }
.intro p { margin: 0 0 14px; color: var(--muted); max-width: 62ch; }
.list { display: grid; gap: 10px; padding-bottom: 8px; }
.item { line-height: 1.4; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 16px 18px; cursor: pointer; text-align: left; border-radius: 20px; width: 100%; font-weight: 400; }
.item .t { font: 650 17px/1.3 var(--display); }
.item .s { grid-column: 1 / -1; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .m { font-size: 12.5px; color: var(--muted); }
.chip { font: 600 11.5px/1 var(--text); letter-spacing: .03em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px; background: var(--seg); color: var(--muted); align-self: start; white-space: nowrap; }
.chip.written { color: var(--ora); }
.chip.sent { color: var(--doria); }
.chip.ready { color: var(--aromi); }
.empty { padding: 22px; text-align: center; color: var(--muted); }

/* chat */
.chat { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 860px; margin: 0 auto; overflow: hidden; }
.log { flex: 1; min-height: 0; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 86%; padding: 12px 15px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; }
.msg.me { align-self: flex-end; background: var(--ink); color: var(--bg); border-bottom-right-radius: 6px; }
.msg.ai { align-self: flex-start; background: var(--glass-strong); border: 1px solid var(--stroke); border-bottom-left-radius: 6px; white-space: normal; }
.msg.ai p { margin: 0 0 8px; } .msg.ai p:last-child { margin-bottom: 0; }
.q { margin-top: 10px; } .q b { display: block; font-weight: 600; margin-bottom: 6px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts button { font-weight: 500; font-size: 13.5px; padding: 8px 12px; background: var(--seg); box-shadow: none; border-color: transparent; text-align: left; line-height: 1.3; }
.opts button.on { background: var(--ink); color: var(--bg); }
.proposal { margin-top: 12px; padding: 14px; border-radius: 16px; background: var(--seg); }
.proposal .eyebrow { font: 700 11px/1 var(--text); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.proposal h3 { font: 650 17px/1.3 var(--display); margin: 0 0 6px; }
.proposal p { margin: 0 0 12px; }
.proposal .row { display: flex; gap: 8px; flex-wrap: wrap; }
/* Scout sessions: the Subject as an editable card, its Background underneath (as on the Reflection page). */
.subj { align-self: stretch; padding: 16px 18px; border-radius: 18px; background: var(--glass-strong); border: 1px solid var(--stroke); display: grid; gap: 8px; }
.subj .eyebrow { font: 700 11px/1 var(--text); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.subj input, .subj textarea { font: inherit; color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 4px 8px; margin: 0 -8px; width: calc(100% + 16px); box-sizing: border-box; min-height: 0; max-height: none; flex: none; resize: none; }
.subj input:hover, .subj textarea:hover { border-color: var(--hairline); }
.subj input:focus, .subj textarea:focus { border-color: var(--stroke); background: var(--seg); outline: none; }
.subj input:read-only, .subj textarea:read-only { border-color: transparent; background: transparent; }
.subj .s-title { font: 650 20px/1.3 var(--display); letter-spacing: -.01em; }
.subj .s-stmt { font-size: 15px; line-height: 1.5; overflow: hidden; }
.subj .s-bg { border-top: 1px solid var(--hairline); padding-top: 10px; margin-top: 2px; font-size: 14px; }
.subj .s-bg p { margin: 6px 0 0; } .subj .s-bg a { color: inherit; }
.subj .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.bgcard { align-self: stretch; padding: 12px 15px; border-radius: 16px; background: var(--seg); font-size: 14px; }
.bgcard summary { cursor: pointer; font-weight: 650; }
.bgcard p { margin: 8px 0 0; } .bgcard a { color: inherit; }
.status { align-self: flex-start; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 10px; }
.status.err { color: var(--danger); }
.dots i { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
.composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--hairline); align-items: flex-end; }
textarea { flex: 1; resize: none; font: 15px/1.45 var(--text); color: var(--ink); background: var(--glass-strong); border: 1px solid var(--stroke); border-radius: 16px; padding: 10px 14px; min-height: 44px; max-height: 160px; }

/* reflection viewer */
.viewer { flex: 1; min-height: 0; border-radius: 22px; overflow: hidden; }
.viewer iframe { width: 100%; height: 100%; border: 0; display: block; background: transparent; }

/* sheet (dialogs) */
.scrim { position: fixed; inset: 0; background: rgba(10,12,20,.35); display: grid; place-items: center; padding: 16px; z-index: 10; }
.sheet { width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 22px; background: var(--glass-strong); }
.sheet h2 { font: 700 20px/1.2 var(--display); margin: 0 0 8px; }
.sheet ol { padding-left: 20px; margin: 12px 0; } .sheet li { margin-bottom: 12px; }
.sheet .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 16px; }
.sheet .manual { margin-top: 14px; border-top: 1px solid var(--hairline, rgba(127,127,127,.2)); padding-top: 10px; }
.sheet .manual summary { cursor: pointer; }
.sheet .picks { display: grid; gap: 6px; max-height: 50vh; overflow: auto; margin: 12px 0; }
.sheet .pick { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; cursor: pointer; }
.sheet .pick:hover { background: color-mix(in srgb, currentColor 6%, transparent); }
.sheet .pick span:nth-of-type(1) { flex: 1; min-width: 0; }
.row-start { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet textarea { width: 100%; min-height: 110px; max-height: 260px; }
.note { font-size: 13px; color: var(--muted); margin-top: 6px; }

@media (max-width: 640px) {
  .bar { flex-wrap: wrap; }
  .bar h1 { flex-basis: calc(100% - 60px); }
  .bar .actions { width: 100%; justify-content: flex-start; }
  .bar .actions button { padding: 9px 13px; }
  .msg { max-width: 94%; }
  .intro h2 { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .6; } }
</style>
</head>
<body>
<div class="fields" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="bar glass" hidden>
  <button class="ghost" id="back" hidden aria-label="Back to the Studio">‹ Studio</button>
  <h1 id="heading">Framoid Studio</h1>
  <div class="actions" id="actions"></div>
</header>

<main>
  <section class="view home" id="v-home">
    <div class="intro glass">
      <h2>Framoid Studio</h2>
      <div class="row-start"><button class="primary" id="new">New Reflection</button><button id="writeall" hidden>Write</button><button id="bulk" hidden>Publish</button><button id="balance" title="Framoid's balance: how much each god's Reading counts">Balance</button></div>
      <p class="note" id="unavailable" hidden></p>
    </div>
    <div class="list" id="list"><div class="glass empty">Loading…</div></div>
  </section>

  <section class="view" id="v-chat" hidden>
    <div class="chat glass">
      <div class="log" id="log" aria-live="polite"></div>
      <form class="composer" id="composer">
        <textarea id="box" rows="1" placeholder="A topic, a question, or “Subject: …”" aria-label="Message"></textarea>
        <button class="primary" id="send" type="submit">Send</button>
        <button id="stop" type="button" hidden>Stop</button>
      </form>
    </div>
  </section>

  <section class="view" id="v-read" hidden>
    <div class="viewer glass"><iframe id="frame" title="Reflection"></iframe></div>
  </section>
</main>

<div class="scrim" id="scrim" hidden><div class="sheet glass" id="sheet" role="dialog" aria-modal="true"></div></div>

<script id="studio-files" type="application/json">{}</script>
<!-- balance:start --><script id="fb-balance">
/* Framoid balance: how much each god's Reading counts. Shared by framoid.com (home and every Reflection
   page) and the Studio; tools/sync_balance.py copies this file into each page between the balance markers.
   30 points are shared by the six gods, but no number is ever shown. On the dial, a god nearer Framoid
   counts more; pulling one in pushes the others out in proportion (one shared pool), and a god on the rim
   counts for nothing. Framoid's balance (the master profile) is set in the Studio and published as
   /balance.json; a reader may change it for themselves (kept in their browser, for every page).
   The result is Framoid's own colour: on a Reflection its orb shades from red (opposed) through amber
   (balanced) to green (embraced) with the weighted share of the gods that embrace the Subject; elsewhere it
   blends the gods' colours. The gods keep their colours, with a small red or green dot for their stance. */
(function () {
  "use strict";
  if (window.FramoidBalance) return;
  const GODS = ["rodim", "mir", "idrom", "aromi", "ora", "doria"];
  const NAME = { rodim: "Rodim", aromi: "Aromi", mir: "Mir", ora: "Ora", idrom: "Idrom", doria: "Doria" };
  const ANG = { rodim: -150, mir: -90, idrom: -30, aromi: 30, ora: 90, doria: 150 }; // as on the Subject dial
  const T = 30, RIN = 82, ROUT = 182, E = 0.39, KEY = "framoid.balance";
  const equal = () => Object.fromEntries(GODS.map(g => [g, T / 6]));
  // Any set of non-negative weights, scaled so they add up to 30. All zero (or nothing) means equal.
  function norm(w) {
    const v = Object.fromEntries(GODS.map(g => [g, Math.max(0, Number(w && w[g]) || 0)]));
    const s = GODS.reduce((a, g) => a + v[g], 0);
    return s > 1e-9 ? Object.fromEntries(GODS.map(g => [g, v[g] * T / s])) : equal();
  }
  const same = (a, b) => GODS.every(g => Math.abs(a[g] - b[g]) < 0.05);
  let master = equal();
  const store = {
    get() { try { const x = JSON.parse(localStorage.getItem(KEY) || "null"); return x && x.weights ? norm(x.weights) : null; } catch { return null; } },
    set(w) { try { localStorage.setItem(KEY, JSON.stringify({ weights: w })); } catch {} },
    clear() { try { localStorage.removeItem(KEY); } catch {} }
  };
  const emit = () => window.dispatchEvent(new CustomEvent("framoid:balance"));

  /* ---------- the result: Framoid's colour, red to green ---------- */
  // f = share of weight that embraces the Subject (0..1); 0 = red, 0.5 = amber, 1 = green (mixed in oklch).
  function tide(stances, w) {
    const st = stances || {};
    if (!GODS.every(g => st[g] === "embraces" || st[g] === "opposes")) return null;
    w = w || current();
    const f = GODS.reduce((a, g) => a + (st[g] === "embraces" ? w[g] : 0), 0) / T, s = 2 * f - 1, k = Math.abs(s);
    // Words only for screen readers.
    const say = k < 0.1 ? "evenly balanced" : (k < 0.45 ? "leaning toward " : "weighted toward ") + (s > 0 ? "embracing" : "opposing");
    const color = f < 0.5 ? `color-mix(in oklch, var(--fb-no), var(--fb-mid) ${(f * 200).toFixed(1)}%)`
                          : `color-mix(in oklch, var(--fb-mid), var(--fb-yes) ${((f - 0.5) * 200).toFixed(1)}%)`;
    return { f, s, say, color };
  }
  // A Framoid orb as HTML (home cards): <span class="fb-orb"> coloured by --fc.
  const orb = (t, cls = "") => t ? `<span class="fb-orb ${cls}" style="--fc:${t.color}" role="img" aria-label="Framoid: ${t.say}"></span>` : "";
  const setOrb = (el, t) => { if (el && t) { el.style.setProperty("--fc", t.color); el.setAttribute("aria-label", "Framoid: " + t.say); } };
  // A stance dot for a god (HTML): green embraces, red opposes.
  const dot = st => st === "embraces" || st === "opposes" ? `<span class="fb-sd ${st === "embraces" ? "yes" : "no"}" aria-hidden="true"></span>` : "";
  const current = () => store.get() || master;

  /* ---------- styles (use each page's own glass and god colours) ---------- */
  const css = `
:root { --fb-yes: #1fa363; --fb-no: #dc3b34; --fb-mid: #e9a516;
  --fb-noise: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>"); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fb-yes: #35d184; --fb-no: #ff5a52; --fb-mid: #f5b731; } }
:root[data-theme="dark"] { --fb-yes: #35d184; --fb-no: #ff5a52; --fb-mid: #f5b731; }
.fb-orb { --fc: #888; position: relative; display: inline-block; flex: none; width: 18px; height: 18px; border-radius: 50%; isolation: isolate;
  background: radial-gradient(circle at 34% 28%, color-mix(in srgb, var(--fc) 30%, white) 0%, var(--fc) 52%, color-mix(in srgb, var(--fc) 62%, black) 100%);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.75), inset 0 -3px 6px rgba(0,0,0,.2), 0 0 8px 1px color-mix(in srgb, var(--fc) 60%, transparent), 0 0 18px 4px color-mix(in srgb, var(--fc) 28%, transparent);
  transition: background .4s, box-shadow .4s; }
.fb-orb::before { content: ""; position: absolute; inset: 0; border-radius: 50%; opacity: .35; mix-blend-mode: soft-light; background-image: var(--fb-noise); background-size: 60px; }
.fb-orb::after { content: ""; position: absolute; left: 20%; top: 12%; width: 38%; height: 26%; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255,255,255,.85), rgba(255,255,255,0) 70%); }
.fb-sd { position: absolute; width: 6px; height: 6px; border-radius: 50%; right: -2px; bottom: -2px; box-sizing: content-box; border: 1.5px solid var(--bg, #fff); }
.fb-sd.yes { background: var(--fb-yes); } .fb-sd.no { background: var(--fb-no); }
@keyframes fb-breathe { 50% { transform: scale(1.06); opacity: .75; } }
.fb-btn { position: fixed; z-index: 40; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  width: 40px; height: 40px; border-radius: 50%; padding: 0; display: grid; place-items: center; cursor: pointer; color: var(--ink, #14151a);
  border: 1px solid var(--stroke, rgba(255,255,255,.7)); background: var(--glass-strong, rgba(255,255,255,.8));
  -webkit-backdrop-filter: blur(20px) saturate(175%); backdrop-filter: blur(20px) saturate(175%);
  box-shadow: inset 0 1px 0 var(--hl, rgba(255,255,255,.95)), 0 6px 18px -8px var(--shadow, rgba(30,36,70,.2)); }
.fb-btn:hover { transform: scale(1.05); }
.fb-btn svg { width: 24px; height: 24px; }
.fb-btn.custom::after { content: ""; position: absolute; top: 3px; right: 3px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--focus, #0a6cff); border: 2px solid var(--bg, #eceef4); }
.fb-scrim { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(10, 12, 20, .28);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.fb-sheet { width: min(440px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; padding: 20px 20px 18px; border-radius: 26px;
  color: var(--ink, #14151a); font-family: var(--text, system-ui, sans-serif); text-align: center;
  background: var(--glass-strong, rgba(255,255,255,.85)); border: 1px solid var(--stroke, rgba(255,255,255,.7));
  -webkit-backdrop-filter: blur(30px) saturate(175%); backdrop-filter: blur(30px) saturate(175%);
  box-shadow: inset 0 1px 0 var(--hl, rgba(255,255,255,.95)), 0 24px 60px -20px var(--shadow, rgba(30,36,70,.3)); }
.fb-sheet h2 { margin: 0 0 4px; font: 600 19px/1.25 var(--display, var(--text, system-ui)); letter-spacing: -.01em; }
.fb-sheet p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--muted, #5c606e); }
.fb-dial { display: block; width: 100%; max-width: 400px; margin: 4px auto 6px; touch-action: none; user-select: none; -webkit-user-select: none; overflow: visible; }
.fb-dial .hoop { fill: none; stroke: var(--hairline, rgba(20,24,40,.1)); stroke-width: 1; }
.fb-dial .mid { fill: none; stroke: var(--hairline, rgba(20,24,40,.1)); stroke-width: 1; stroke-dasharray: 2 5; }

    document.querySelector(".bar").hidden = view === "home"; // the home intro already names the Studio
    document.body.classList.toggle("work", view !== "home");
    if (view === "home") { $("heading").textContent = "Framoid Studio"; $("actions").innerHTML = ""; cur = null; }
  }

  function statusChip(it) {
    if (it.status === "sent") return '<span class="chip sent">Live</span>';
    if (it.status === "written") return '<span class="chip written">Written</span>';
    if (it.proposal) return '<span class="chip ready">Ready to write</span>';
    return '<span class="chip">Shaping</span>';
  }
  function renderList() {
    const list = $("list");

    list.innerHTML = items.map(it => {

      return `<button class="item glass" data-id="${esc(it.id)}">

  }
  $("list").addEventListener("click", e => {

    const it = items.find(i => i.id === b.dataset.id); if (it) open(it);
  });

  function open(it) {
    cur = JSON.parse(JSON.stringify(it)); // snapshots are frozen; work on a copy
    if (it.reflection) openReading(); else openChat();
  }

  /* ---------- chat ---------- */
  function openChat() {
    show("chat");
    $("heading").textContent = cur.number ? "Reflection " + cur.number : "New Reflection";
    $("actions").innerHTML = cur.reflection ? "" : '<button class="danger ghost" id="del">Delete</button>';
    const del = $("del"); if (del) del.onclick = confirmDelete;
    renderLog();
    if (!scoutMode()) $("box").focus(); // a scout Subject opens to read and edit, without the keyboard
  }

  function aiBubble(raw, i, last) {
    let m; try { m = JSON.parse(raw); } catch { m = { say: raw }; }
    const say = (m.say || "").split(/\n+/).filter(Boolean).map(t => `<p>${esc(t)}</p>`).join("");
    const qs = (last && Array.isArray(m.questions) ? m.questions : []).map((q, qi) =>
      `<div class="q"><b>${esc(q.q)}</b><div class="opts">${(q.options || []).map(o =>
        `<button type="button" data-q="${qi}" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>`).join("");
    const pastQs = (!last && Array.isArray(m.questions) && m.questions.length) ? m.questions.map(q => `<p class="muted small">${esc(q.q)}</p>`).join("") : "";
    let prop = "";
    if (m.proposal && m.proposal.title && scoutMode()) {
      prop = `<p class="small muted">The Subject above is updated.</p>`;
    } else if (m.proposal && m.proposal.title) {
      prop = `<div class="proposal"><div class="eyebrow">Proposed Subject</div><h3>${esc(m.proposal.title)}</h3><p>${esc(m.proposal.statement)}</p>` +
        (last ? `<div class="row"><button class="primary" type="button" data-act="write">Write this Reflection</button><button type="button" data-act="adjust">Adjust</button></div>` : "") + `</div>`;
    }
    return `<div class="msg ai" data-i="${i}">${say}${pastQs}${qs}${prop}</div>`;
  }

  function renderLog(status) {
    const turns = cur.turns || [];
    let html = "";
    const scout = scoutMode();
    if (scout) html += subjectCard(!!status && !status.includes("status err")); // locked only while Claude is working
    else if (cur.context && cur.context.brief) {
      const src = (cur.context.sources || []).filter(x => x && /^https?:\/\//.test(x.url));
      html += `<details class="bgcard"><summary>Background${cur.context.preparedAt ? " · prepared " + esc(String(cur.context.preparedAt).slice(0, 10)) : ""}</summary>
        ${String(cur.context.brief).split(/\n+/).filter(Boolean).map(t => `<p>${esc(t)}</p>`).join("")}
        ${src.length ? `<p class="small muted">Sources: ${src.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title || x.url)}</a>`).join(" · ")}</p>` : ""}</details>`;
    }
    // Origin (scout generalization): the specific case behind a generalized Subject. Shown to the owner only;
    // never sent to Claude and never published (prompts and withBackground read only proposal/context/reflection).
    const sp = cur.specific;
    if (sp && (sp.title || sp.statement)) {
      const ssrc = (sp.sources || []).filter(x => x && /^https?:\/\//.test(x.url));
      html += `<details class="bgcard"><summary>Origin</summary>
        ${sp.title ? `<p><strong>${esc(sp.title)}</strong></p>` : ""}${sp.statement ? `<p>${esc(sp.statement)}</p>` : ""}
        ${String(sp.brief || "").split(/\n+/).filter(Boolean).map(t => `<p class="small">${esc(t)}</p>`).join("")}
        ${ssrc.length ? `<p class="small muted">Sources: ${ssrc.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title || x.url)}</a>`).join(" · ")}</p>` : ""}</details>`;
    }
    // A Subject scout session stores a seed user turn ("Subject chosen in a Subject scout session: …"): kept in the
    // data for older sessions, but never shown and never sent to Claude.
    if (!scout && !turns.some(t => !isSeed(t))) html += `<div class="msg ai"><p>What should this Reflection consider? Give me a topic or a rough idea and we'll shape the Subject together, or write “Subject: …” if you already know it.</p></div>`;
    turns.forEach((t, i) => {
      if (isSeed(t)) return;
      const last = i === turns.length - 1 && !status;
      html += t.role === "user" ? `<div class="msg me">${esc(t.content)}</div>` : aiBubble(t.content, i, last);
    });
    if (status) html += status;
    $("log").innerHTML = html;
    if (scout) wireSubjectCard();
    $("log").scrollTop = scout && !turns.some(t => !isSeed(t)) ? 0 : $("log").scrollHeight;
    $("box").placeholder = scout ? "Ask Claude to change the Subject…" : "A topic, a question, or “Subject: …”";
  }
  const isSeed = t => t && ((t.role === "user" && /^Subject chosen in a Subject scout session/.test(String(t.content || "")))
    || (t.role === "assistant" && String(t.content || "").includes("Here is the Subject, with researched background above")));
  // A Subject prepared by Subject scout opens as an editable Subject card instead of a chat exchange.
  const scoutMode = () => !!(cur && cur.origin === "scout" && !cur.reflection && cur.proposal);
  const linesHtml = (text, cls = "") => String(text || "").split(/\n+/).filter(Boolean).map(t => `<p${cls ? ` class="${cls}"` : ""}>${esc(t)}</p>`).join("");
  const srcHtml = list => { const src = (list || []).filter(x => x && /^https?:\/\//.test(x.url));
    return src.length ? `<p class="small muted">Sources: ${src.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title || x.url)}</a>`).join(" · ")}</p>` : ""; };
  function subjectCard(locked) {
    const p = cur.proposal || {}, c = cur.context || {}, ro = locked ? " readonly" : "";
    return `<section class="subj" aria-label="Subject">
      <span class="eyebrow">Subject</span>
      <input id="s-title" class="s-title" value="${esc(p.title || "")}" aria-label="Subject title"${ro}>
      <textarea id="s-stmt" class="s-stmt" rows="1" aria-label="Subject statement"${ro}>${esc(p.statement || "")}</textarea>
      ${c.brief ? `<div class="s-bg"><span class="eyebrow">Background</span>${linesHtml(c.brief)}${srcHtml(c.sources)}</div>` : ""}
      <div class="row"><button class="primary" type="button" data-act="write"${locked ? " disabled" : ""}>Write this Reflection</button></div>
    </section>`;
  }
  let saveTimer = null;
  function wireSubjectCard() {
    const t = $("s-title"), st = $("s-stmt"); if (!t || !st) return;
    const fit = () => { st.style.height = "auto"; st.style.height = st.scrollHeight + "px"; }; fit();
    const btn = $("log").querySelector('.subj [data-act="write"]');
    const onEdit = () => {
      fit();
      cur.proposal = { title: t.value.trim(), statement: st.value.trim() };
      if (btn) btn.disabled = !cur.proposal.title || !cur.proposal.statement;
      clearTimeout(saveTimer); saveTimer = setTimeout(() => save(cur).catch(() => {}), 700);
    };
    t.addEventListener("input", onEdit); st.addEventListener("input", onEdit);
  }
  const thinking = label => `<div class="status"><span class="dots"><i></i><i></i><i></i></span>${esc(label)}</div>`;
  const failed = msg => `<div class="status err">${esc(msg)}</div>`;

  // option chips: pick one per question; picked answers are composed into the box
  const picks = {};
  $("log").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || busy) return;
    if (b.dataset.act === "write") return writeReflection();
    if (b.dataset.act === "write-complex") return writeReflection("complex");
    if (b.dataset.act === "adjust") { $("box").focus(); return; }
    if (b.dataset.q != null) {
      const q = b.dataset.q;
      b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b && !(picks[q] === b.dataset.o)));
      picks[q] = picks[q] === b.dataset.o ? undefined : b.dataset.o;
      const lines = Object.keys(picks).sort().map(k => picks[k]).filter(Boolean);
      $("box").value = lines.join("\n");
      autosize();
    }
  });

  function autosize() { const t = $("box"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; }
  $("box").addEventListener("input", autosize);
  $("box").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); } });

  function setBusy(on) {
    busy = on; $("send").hidden = on; $("stop").hidden = !on; $("box").disabled = on;
    document.querySelectorAll("#actions button").forEach(b => b.disabled = on);
  }
  $("stop").onclick = () => ctl && ctl.abort();

  $("composer").addEventListener("submit", async e => {
    e.preventDefault();
    const text = $("box").value.trim(); if (!text || busy || !cur) return;
    for (const k in picks) delete picks[k];
    $("box").value = ""; autosize();
    cur.turns = cur.turns || [];
    cur.turns.push({ role: "user", content: text });
    if (!cur.firstMessage) cur.firstMessage = text.slice(0, 120);
    renderLog(thinking("Thinking"));
    setBusy(true);
    ctl = new AbortController();
    try {
      const input = [{ role: "user", content: shapePrompt() }, ...cur.turns.filter(t => !isSeed(t)).slice(-24)];
      const m = await sample.json(input, { cache: false, signal: ctl.signal });
      const reply = { say: String(m.say || ""), questions: Array.isArray(m.questions) ? m.questions.slice(0, 3) : [], proposal: m.proposal && m.proposal.title ? { title: String(m.proposal.title), statement: String(m.proposal.statement || "") } : null };
      cur.turns.push({ role: "assistant", content: JSON.stringify(reply) });
      if (reply.proposal) cur.proposal = reply.proposal;
      await save(cur);
      renderLog();
    } catch (err) {
      cur.turns.pop();
      $("box").value = text; autosize();
      renderLog(err && err.code === "cancelled" ? "" : failed(errText(err)));
    } finally { setBusy(false); $("box").focus(); }
  });

  // Writing streams, so the status shows progress; on failure it says how long it ran and how much came back,
  // and offers the standard model as well as a retry (the most capable model sometimes drops long answers).
  const elapsed = ms => { const s = Math.round(ms / 1000); return s < 60 ? s + " s" : Math.floor(s / 60) + " min " + (s % 60) + " s"; };
  // Writes one Subject into a Reflection and saves it. Shared by "Write this Reflection" and "Write".
  const readyToWrite = it => !!(it && !it.reflection && it.proposal && it.proposal.title && it.proposal.statement);
  async function writeCore(it, tier, signal, onText, taken = []) {
    let r = await sample.json(writePrompt(it.proposal, it), { modelTier: tier, cache: false, signal, onText });
    if (r && r.reflection) r = r.reflection;
    const bad = problems(r);
    if (bad.length) throw { message: "The Reflection came back incomplete (" + bad.slice(0, 4).join(", ") + "). Try again." };
    r.subject = { title: it.proposal.title, statement: it.proposal.statement };
    const bg = bgOf(it); if (bg) r.subject.background = bg;
    it.number = it.number || nextNumber(taken);
    it.reflection = { schema: 5, number: it.number, date: new Date().toISOString().slice(0, 10), ...normalise(r) };
    it.status = "written";
    await save(it);
    return it;
  }
  async function writeReflection(tier = "default") { // standard model by default; the most capable one on request
    if (!cur.proposal || !cur.proposal.title || !cur.proposal.statement || busy) return;
    clearTimeout(saveTimer);
    const t0 = Date.now(); let got = 0;
    renderLog(`<div class="status" id="w-status"><span class="dots"><i></i><i></i><i></i></span><span id="w-label">Writing the six Readings and The Field${tier === "complex" ? " with the most capable model" : ""}. Claude thinks first, then writes.</span></div>`);
    setBusy(true);
    ctl = new AbortController();
    const tick = setInterval(() => { const l = $("w-label"); if (l) l.textContent = got ? `Writing… ${got.toLocaleString()} characters (${elapsed(Date.now() - t0)})` : `Claude is thinking… (${elapsed(Date.now() - t0)})`; }, 1000);
    try {
      await writeCore(cur, tier, ctl.signal, ({ text }) => { got = text.length; });
      openReading();
    } catch (err) {
      if (err && err.code === "cancelled") { renderLog(""); return; }
      const when = ` (after ${elapsed(Date.now() - t0)}${got ? ", " + got.toLocaleString() + " characters written" : ", before any text"})`;
      renderLog(`<div class="status err" style="flex-direction:column;align-items:flex-start;gap:8px">${esc(errText(err) + when)}
        <span class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" data-act="${tier === "complex" ? "write-complex" : "write"}">Try again</button>${tier === "complex" ? '<button type="button" data-act="write">Try the standard model</button>' : '<button type="button" data-act="write-complex">Try the most capable model</button>'}</span></div>`);
    } finally { clearInterval(tick); setBusy(false); }
  }

  /* ---------- reading ---------- */
  function openReading() {
    cur.reflection = withBackground(cur);
    show("read");
    $("heading").textContent = ""; // the Reflection shows its own title
    $("actions").innerHTML = `<button id="a-revise">Revise</button><button class="primary" id="a-pub">${cur.status === "sent" ? "Republish" : "Publish"}</button><button class="ghost" id="a-chat">Chat</button><button class="danger ghost" id="a-del">Delete</button>`;
    $("a-revise").onclick = reviseSheet; $("a-pub").onclick = publishSheet; $("a-chat").onclick = openChat; $("a-del").onclick = confirmDelete;
    const json = JSON.stringify(cur.reflection).replace(/</g, "\\u003c");
    // Framoid's balance goes in too, so the preview's centre is weighted as on the site; "fixed" hides the reader's button.
    const bal = JSON.stringify({ weights: window.FramoidBalance.master(), fixed: true });
    const block = `<script id="reflection" type="application/json">${json}<\/script><script id="balance" type="application/json">${bal}<\/script>`;
    const title = esc("Framoid Reflection " + cur.number + ": " + cur.reflection.subject.title);
    $("frame").srcdoc = files.template.replace("<title>Framoid Reflection</title>", "<title>" + title + "</title>").replace("<body>", "<body>" + block);
  }

  /* ---------- sheets ---------- */
  function sheet(html) { $("sheet").innerHTML = html; $("scrim").hidden = false; const f = $("sheet").querySelector("textarea, button"); if (f) f.focus(); }
  function closeSheet() { $("scrim").hidden = true; $("sheet").innerHTML = ""; }
  $("scrim").addEventListener("click", e => { if (e.target === $("scrim") && !busy) closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("scrim").hidden && !busy) closeSheet(); });

  function reviseSheet() {
    sheet(`<h2>Revise</h2><p class="muted small">Say what to change. Everything else stays word for word.</p>
      <textarea id="rev" placeholder="e.g. Make Doria's Reading warmer, or give Mir a sharper Imprint"></textarea>
      <div id="rev-status" class="note"></div>
      <div class="row"><button id="rev-cancel">Cancel</button><button id="rev-stop" hidden>Stop</button><button class="primary" id="rev-go">Revise</button></div>`);
    $("rev-cancel").onclick = closeSheet;
    $("rev-stop").onclick = () => ctl && ctl.abort();
    $("rev-go").onclick = async () => {
      const ins = $("rev").value.trim(); if (!ins) return;
      busy = true; $("rev-go").disabled = true; $("rev-cancel").hidden = true; $("rev-stop").hidden = false; $("rev").disabled = true;
      $("rev-status").innerHTML = thinking("Revising. This can take a minute or two");
      ctl = new AbortController();
      try {
        let r = await sample.json(revisePrompt(cur.reflection, ins), { modelTier: "default", cache: false, signal: ctl.signal });
        if (r && r.reflection) r = r.reflection;
        const bad = problems(r);
        if (bad.length) throw { message: "The revision came back incomplete (" + bad.slice(0, 4).join(", ") + "). Try again." };
        const { schema, number, date } = cur.reflection;
        const keepBg = cur.reflection.subject && cur.reflection.subject.background;
        if (keepBg && r.subject) r.subject.background = keepBg;
        cur.reflection = { schema, number, date, ...normalise(r) };
        cur.revisions = (cur.revisions || []).concat([{ at: now(), instruction: ins }]).slice(-20);
        if (cur.status === "sent") cur.status = "written";
        await save(cur);
        busy = false; closeSheet(); openReading();
      } catch (err) {
        busy = false;
        $("rev-status").innerHTML = err && err.code === "cancelled" ? "Stopped." : `<span style="color:var(--danger)">${esc(errText(err))}</span>`;
        $("rev-go").disabled = false; $("rev-cancel").hidden = false; $("rev-stop").hidden = true; $("rev").disabled = false;
      }
    };
  }

  /* ---------- publishing ---------- */
  // Direct: the "GitHub" connector (GitHub's remote MCP server) commits r/<slug>/reflection.json to the
  // site repo in one push; the site's workflow checks and deploys it. By hand: the copy-and-commit steps.
  const GH = { server: "GitHub", tool: "push_files", owner: "ilkay777", repo: "framoid", branch: "main" };
  const slugOf = it => String(it.number).toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "");
  // Same test the site applies on every push (tools/publish.py check), so older Reflections (schema 3, no
  // Instruments) can be published too; problems() is the stricter test for newly written ones.
  const publishable = it => {
    const r = it && it.reflection;
    if (!r || !it.number || !(r.subject && r.subject.title) || !(r.field && (r.field.paragraphs || []).length)) return false;
    return GODS.every(g => Object.values(r.pairs || {}).some(p => p && p[g] && p[g].answer));
  };
  async function pushToSite(list) {
    if (!mcp) throw { code: "not_granted" };
    const files = list.map(it => ({ path: `r/${slugOf(it)}/reflection.json`, content: JSON.stringify(withBackground(it), null, 1) + "\n" }));
    const names = list.map(it => it.number).join(", ");
    return mcp.callTool(GH.server, GH.tool, { owner: GH.owner, repo: GH.repo, branch: GH.branch, files,
      message: (list.length === 1 ? "Publish Reflection " : "Publish Reflections ") + names + " (from the Studio)" });
  }
  async function markSent(list) {
    const at = now();
    for (const it of list) {
      const doc = it.id === (cur && cur.id) ? cur : JSON.parse(JSON.stringify(it));
      doc.reflection = withBackground(doc); doc.status = "sent"; doc.sentAt = at;
      try { await save(doc); } catch {}
    }
  }
  const pushError = e => {
    const c = e && e.code;
    if (c === "not_granted" || c === "capability_disabled" || c === "capability_removed") return "Direct publishing isn't available in this view. Use the steps by hand below.";
    if (c === "server_not_connected" || c === "server_not_found") return "The GitHub connector isn't connected. Connect it in claude.ai → Customize → Connectors, then try again.";
    if (c === "needs_reauth") return "GitHub needs you to sign in again: claude.ai → Customize → Connectors → GitHub → Connect.";
    if (c === "approval_required" || c === "not_in_manifest" || c === "consent_required") return "The Studio needs your permission to use GitHub. Press the button again and choose Allow.";
    if (c === "selection_required") return "You have more than one GitHub connector. Choose one when claude.ai asks, then try again.";
    if (c === "blocked_by_policy") return "Your organisation's settings block this GitHub tool.";
    if (c === "tool_error") return "GitHub refused the commit: " + String((e && e.message) || "").slice(0, 200);
    return "No clear answer came back from GitHub, so the page may or may not have been published. Check the site in a minute before trying again.";
  };
  const manualSteps = (it, again) => {
    const slug = slugOf(it);
    const newLink = `${REPO_NEW}?filename=reflection-${encodeURIComponent(slug)}.json`;
    const link = again ? `${REPO_EDIT}/${encodeURIComponent(slug)}/reflection.json` : newLink;
    return `<ol>
        <li><button id="p-copy">Copy Reflection</button> <span id="p-copied" class="note"></span>
          <textarea id="p-json" readonly hidden aria-label="Reflection JSON"></textarea></li>
        <li><a class="btn" href="${esc(link)}" target="_blank" rel="noopener">${again ? "Open the published file ↗" : "Open GitHub inbox ↗"}</a>
          <div class="note">${again ? `Opens r/${esc(slug)}/reflection.json, the file behind the live page. Not there any more? <a href="${esc(newLink)}" target="_blank" rel="noopener">Create it in the inbox</a> instead.`
            : `Opens a new file named reflection-${esc(slug)}.json in your site's inbox.`}</div></li>
        <li>${again ? "Select all the text in the file, paste over it" : "Paste into the file"} and press <b>Commit changes</b>, then <button class="ghost" id="p-done" type="button">mark it published</button>.</li>
      </ol>`;
  };

  function publishSheet() {
    const slug = slugOf(cur), again = cur.status === "sent";
    const json = JSON.stringify(withBackground(cur), null, 1);
    sheet(`<h2>${again ? "Republish" : "Publish to framoid.com"}</h2>
      <p class="muted small">Commits this Reflection to the site through your GitHub connector. No AI is used. The page goes live at ${esc(SITE)}/r/${esc(slug)}/ about two minutes later.${again ? " This replaces the live page." : ""}</p>
      <div id="p-status" class="note"></div>
      <div class="row"><button id="p-close">Close</button><button class="primary" id="p-go"${mcp ? "" : " disabled"}>${again ? "Republish" : "Publish now"}</button></div>
      <details class="manual"${mcp ? "" : " open"}><summary class="small muted">Or publish by hand</summary>${manualSteps(cur, again)}</details>`);
    if (!mcp) $("p-status").textContent = pushError({ code: "not_granted" });
    $("p-json").value = json;
    $("p-copy").onclick = async () => {
      try { await navigator.clipboard.writeText(json); $("p-copied").textContent = "Copied."; }
      catch { $("p-json").hidden = false; $("p-json").select(); $("p-copied").textContent = "Copy the text below (select all, copy)."; }
    };
    $("p-close").onclick = () => { if (!busy) closeSheet(); };
    $("p-done").onclick = async () => { await markSent([cur]); closeSheet(); openReading(); };
    $("p-go").onclick = async () => {
      if (busy) return;
      busy = true; $("p-go").disabled = true; $("p-close").disabled = true;
      $("p-status").innerHTML = thinking("Committing to GitHub");
      try {
        await pushToSite([cur]);
        await markSent([cur]);
        busy = false;
        $("sheet").innerHTML = `<h2>Published</h2><p class="small">Committed to GitHub. The page will be live at <a href="${esc(SITE)}/r/${esc(slug)}/" target="_blank" rel="noopener">${esc(SITE)}/r/${esc(slug)}/</a> in about two minutes.</p>
          <div class="row"><button class="primary" id="p-ok">Done</button></div>`;
        $("p-ok").onclick = () => { closeSheet(); openReading(); };
      } catch (e) {
        busy = false; $("p-go").disabled = false; $("p-close").disabled = false;
        $("p-status").innerHTML = `<span style="color:var(--danger)">${esc(pushError(e))}</span>`;
      }
    };
  }

  // Bulk: choose several written Reflections and publish them in one commit.
  function bulkSheet() {
    const list = items.filter(publishable).sort((a, b) => (parseInt(a.number, 10) || 0) - (parseInt(b.number, 10) || 0));
    if (!list.length) { sheet(`<h2>Publish</h2><p class="muted small">No written Reflections yet.</p><div class="row"><button id="b-close">Close</button></div>`); $("b-close").onclick = closeSheet; return; }
    sheet(`<h2>Publish</h2>
      <p class="muted small">Choose Reflections to commit to framoid.com together, in one commit through your GitHub connector. Ones already on the site are replaced.</p>
      <div class="picks">${list.map(it => {
        const s = it.reflection.subject || {};
        return `<label class="pick"><input type="checkbox" value="${esc(it.id)}"${it.status === "sent" ? "" : " checked"}>
          <span><b>${esc(it.number)}</b> · ${esc(s.title || "")}</span>${it.status === "sent" ? '<span class="chip sent">Live</span>' : ""}</label>`; }).join("")}</div>
      <div id="b-status" class="note"></div>
      <div class="row"><button id="b-close">Close</button><button class="primary" id="b-go"${mcp ? "" : " disabled"}>Publish selected</button></div>`);
    if (!mcp) $("b-status").textContent = pushError({ code: "not_granted" });
    const chosen = () => [...$("sheet").querySelectorAll(".pick input:checked")].map(x => list.find(it => it.id === x.value)).filter(Boolean);
    const label = () => { const n = chosen().length; $("b-go").textContent = n ? `Publish ${n}` : "Publish selected"; $("b-go").disabled = !mcp || !n || busy; };
    $("sheet").querySelectorAll(".pick input").forEach(x => x.onchange = label); label();
    $("b-close").onclick = () => { if (!busy) closeSheet(); };
    $("b-go").onclick = async () => {
      const sel = chosen(); if (!sel.length || busy) return;
      busy = true; $("b-go").disabled = true; $("b-close").disabled = true;
      $("b-status").innerHTML = thinking(`Committing ${sel.length} to GitHub`);
      try {
        await pushToSite(sel);
        await markSent(sel);
        busy = false;
        $("sheet").innerHTML = `<h2>Published</h2><p class="small">Committed ${sel.length} Reflection${sel.length > 1 ? "s" : ""} (${sel.map(it => esc(it.number)).join(", ")}). They'll be live on <a href="${esc(SITE)}" target="_blank" rel="noopener">${esc(SITE.replace("https://", ""))}</a> in about two minutes.</p>
          <div class="row"><button class="primary" id="b-ok">Done</button></div>`;
        $("b-ok").onclick = closeSheet;
      } catch (e) {
        busy = false; $("b-close").disabled = false; label();
        $("b-status").innerHTML = `<span style="color:var(--danger)">${esc(pushError(e))}</span>`;
      }
    };
  }

  // Write: writes the chosen Subjects marked "Ready to write", one after another, with the standard model.
  // Runs only while the page stays open; a failure is noted and the queue moves on; a usage limit stops the run.
  function writeAllSheet() {
    const queue = items.filter(readyToWrite).sort((a, b) => String(a.createdAt || "").localeCompare(String(b.createdAt || ""))).map(it => JSON.parse(JSON.stringify(it)));
    if (!queue.length) { sheet(`<h2>Write</h2><p class="muted small">No Subjects are ready to write.</p><div class="row"><button id="wa-close">Close</button></div>`); $("wa-close").onclick = closeSheet; return; }
    sheet(`<h2>Write</h2>
      <p class="muted small">Choose Subjects to write. They are written one after another with the standard model, several minutes each, and each write uses your plan like one chat message. Keep this tab open and in front, with the computer awake, until it finishes: a hidden tab can pause the writing. A write that stalls is tried once more.</p>
      <div class="picks">${queue.map((it, i) => `<label class="pick" id="wa-row-${i}"><input type="checkbox" value="${i}" checked><span>${esc(it.proposal.title)}</span><span class="chip" id="wa-${i}" hidden>Waiting</span></label>`).join("")}</div>
      <div id="wa-status" class="note"></div>
      <div class="row"><button id="wa-close">Close</button><button id="wa-stop" hidden>Stop</button><button class="primary" id="wa-go">Write selected</button></div>`);
    const picked = () => [...$("sheet").querySelectorAll(".pick input:checked")].map(x => +x.value);
    const label = () => { const k = picked().length; $("wa-go").textContent = k ? `Write ${k}` : "Write selected"; $("wa-go").disabled = !sample || !k || busy; };
    $("sheet").querySelectorAll(".pick input").forEach(x => x.onchange = label); label();
    let stop = false;
    $("wa-close").onclick = () => { if (!busy) closeSheet(); };
    $("wa-stop").onclick = () => { stop = true; if (ctl) ctl.abort(); };
    $("wa-go").onclick = async () => {
      if (busy) return;
      const sel = picked(); if (!sel.length) return;
      busy = true; $("wa-go").hidden = true; $("wa-close").hidden = true; $("wa-stop").hidden = false;
      queue.forEach((_, i) => { const row = $("wa-row-" + i); row.querySelector("input").disabled = true; if (!sel.includes(i)) row.hidden = true; else $("wa-" + i).hidden = false; });
      const n = sel.length;
      const taken = []; let ok = 0, failed = 0, limit = null;
      const t0 = Date.now();
      // Keep the screen awake while writing, where the browser allows it (renewed when the tab comes back).
      let lock = null;
      const wake = async () => { try { if (navigator.wakeLock && document.visibilityState === "visible") lock = await navigator.wakeLock.request("screen"); } catch {} };
      const onVis = () => { if (document.visibilityState === "visible") wake(); };
      document.addEventListener("visibilitychange", onVis); wake();
      // Watchdog: a write that sends no new text for STALL ms, or runs longer than MAX ms, is stopped and tried
      // once more; a second stall marks it Failed and the queue moves on. (Hidden tabs can freeze a write.)
      const W = window.__WA || {}, STALL = W.stall || 6 * 60000, MAX = W.max || 15 * 60000;
      for (let j = 0; j < n && !stop; j++) {
        const i = sel[j], chip = $("wa-" + i), it = queue[i];
        let done = false;
        for (let attempt = 1; attempt <= 2 && !done && !stop; attempt++) {
          chip.className = "chip ready"; chip.style.color = ""; chip.textContent = attempt > 1 ? "Retrying…" : "Writing…";
          const t1 = Date.now(); let got = 0, last = Date.now(), stalled = false;
          const tick = setInterval(() => {
            chip.textContent = (attempt > 1 ? "Retry · " : "") + (got ? got.toLocaleString() + " chars" : "Thinking " + elapsed(Date.now() - t1));
            if (Date.now() - last > STALL || Date.now() - t1 > MAX) { stalled = true; if (ctl) ctl.abort(); }
          }, 1000);
          $("wa-status").textContent = `Writing ${j + 1} of ${n}…`;
          ctl = new AbortController();
          try {
            await writeCore(it, "default", ctl.signal, ({ text }) => { if (text.length !== got) { got = text.length; last = Date.now(); } }, taken);
            taken.push(it.number); ok++; done = true;
            chip.className = "chip written"; chip.textContent = "Written · " + it.number;
          } catch (err) {
            if (stalled && !stop) { if (attempt === 2) { failed++; chip.className = "chip"; chip.style.color = "var(--danger)"; chip.textContent = "Failed"; chip.title = "Stalled twice: no answer came back."; } continue; }
            if (err && err.code === "cancelled") { chip.className = "chip"; chip.textContent = "Stopped"; stop = true; break; }
            failed++; done = true; chip.className = "chip"; chip.style.color = "var(--danger)"; chip.textContent = "Failed"; chip.title = errText(err);
            if (err && (err.code === "rate_limited" || err.code === "session_expired" || err.code === "not_granted" || err.code === "sampling_disabled")) { limit = errText(err); stop = true; }
          } finally { clearInterval(tick); }
        }
      }
      document.removeEventListener("visibilitychange", onVis);
      try { if (lock) await lock.release(); } catch {}
      busy = false; ctl = null;
      const left = n - ok - failed;
      $("wa-status").innerHTML = esc(`Wrote ${ok} of ${n} in ${elapsed(Date.now() - t0)}.` + (failed ? ` ${failed} failed.` : "") + (left ? ` ${left} not started.` : "")
        + (limit ? " " + limit : "") + (failed || left ? " Press Write again later to continue with the rest." : " Open each to read it, then publish."));
      $("wa-stop").hidden = true; $("wa-close").hidden = false; $("wa-close").textContent = "Done";
    };
  }
  $("writeall").onclick = () => { if (!busy) writeAllSheet(); };

  function confirmDelete() {
    sheet(`<h2>Delete this ${cur.reflection ? "Reflection" : "session"}?</h2>
      <p class="muted small">It is removed from the Studio. ${cur.status === "sent" ? "The copy on framoid.com stays until it is taken down there." : ""}</p>
      <div class="row"><button id="d-no">Cancel</button><button class="danger" id="d-yes">Delete</button></div>`);
    $("d-no").onclick = closeSheet;
    $("d-yes").onclick = async () => {
      try { await col().doc(cur.id).delete(); } catch (e) { $("sheet").querySelector(".small").textContent = "Couldn't delete. Try again."; return; }
      closeSheet(); show("home");
    };
  }

  $("bulk").onclick = () => { if (!busy) bulkSheet(); };

  /* ---------- Framoid's balance (master profile) ---------- */
  // Kept in the Studio's database (settings/balance) and published as /balance.json on framoid.com,
  // where every page reads it; readers may then change it for themselves.
  const round = w => Object.fromEntries(GODS.map(g => [g, Math.round(w[g] * 1000) / 1000]));
  async function loadBalance() {
    try { const d = await db.collection("settings").doc("balance").get(); const v = d && (d.data ? d.data() : d); if (v && v.weights) window.FramoidBalance.setMaster(v.weights); } catch {}
  }
  async function saveBalance(w) {
    const weights = round(w);
    await db.collection("settings").doc("balance").set({ weights, updatedAt: now() });
    if (!mcp) throw { message: "Saved in the Studio. To publish it, open the Studio on claude.ai with the GitHub connector." };
    try {
      await mcp.callTool(GH.server, GH.tool, { owner: GH.owner, repo: GH.repo, branch: GH.branch,
        files: [{ path: "balance.json", content: JSON.stringify({ weights }, null, 1) + "\n" }], message: "Update Framoid's balance (from the Studio)" });
    } catch (e) { throw { message: "Saved in the Studio, but not published: " + pushError(e) }; }
  }
  $("balance").onclick = () => {
    if (busy) return;
    if (!db) return;
    window.FramoidBalance.open({ mode: "master", weights: window.FramoidBalance.master(), onSave: saveBalance });
  };
  $("back").onclick = () => { if (busy) return; show("home"); };

  $("new").onclick = async () => {
    if (!db || !sample) return;
    cur = { id: "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), status: "shaping", createdAt: now(), turns: [] };
    openChat();
  };

  /* ---------- start ---------- */
  async function loadFiles() {
    // Everything is built into this page (see build.py), so nothing depends on how the page is served.
    const el = document.getElementById("studio-files");
    if (!el) throw new Error("files missing");
    const f = JSON.parse(el.textContent);
    files.rules = f.rules; files.shape = f.shape; files.template = f.template; files.legacy = f.legacy || [];
  }

  // One-time import of Reflections made before the Studio (built in by build.py from legacy.json).
  let importing = false;
  async function importLegacy() {
    if (importing || !files.legacy.length) return;
    importing = true;
    for (const r of files.legacy) {
      const id = "legacy-" + r.number;
      if (items.some(i => i.id === id || i.number === String(r.number))) continue;
      const at = (r.date || "2026-11-01") + "T12:00:00.000Z";
      try {
        await col().doc(id).set({ id, status: "written", number: String(r.number), createdAt: at, updatedAt: at, turns: [],
          proposal: { title: r.subject.title, statement: r.subject.statement }, reflection: r, importedFrom: "artifact" });
      } catch (e) { break; }
    }
  }

  async function start() {
    const fail = msg => { $("unavailable").hidden = false; $("unavailable").textContent = msg; $("new").disabled = true; };
    try { await loadFiles(); } catch { fail("The Studio's files could not be loaded. Reload the page."); $("list").innerHTML = ""; return; }
    if (!window.claude || !claude.use) { fail("Open the Studio on claude.ai to use it."); $("list").innerHTML = ""; return; }
    [db, sample, mcp] = await Promise.all([claude.use("db"), claude.use("sample"), claude.use("mcp")]);
    if (!sample) fail("Claude isn't available in this view, so new Reflections can't be written here.");
    if (!db) { fail("Sign in to claude.ai to keep and see your Reflections."); $("list").innerHTML = ""; return; }
    loadBalance();
    const timer = setTimeout(() => { if (!items.length) $("list").innerHTML = '<div class="glass empty">Your Reflections can\'t be reached yet.</div>'; }, 10000);
    unsub = col().orderBy("updatedAt", "desc").onSnapshot(snap => {
      if (!snap.metadata.fromCache) clearTimeout(timer);
      items = snap.docs.map(d => d.data()).filter(Boolean);
      // Home buttons show counts: Write (Subjects ready to write), Publish (written but not yet live).
      const nReady = items.filter(readyToWrite).length, nPub = items.filter(i => publishable(i) && i.status !== "sent").length;
      $("bulk").hidden = !items.some(publishable);
      $("bulk").textContent = nPub ? `Publish (${nPub})` : "Publish";
      $("writeall").hidden = !sample || !nReady;
      $("writeall").textContent = `Write (${nReady})`;
      renderList();
      if (!snap.metadata.fromCache) importLegacy();
    }, () => { clearTimeout(timer); $("list").innerHTML = '<div class="glass empty">Your Reflections can\'t be loaded right now.</div>'; });
  }
  start();
})();
</script>
</body>
</html>
